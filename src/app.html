<title>Played &amp; Made</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: a game designer's notebook. Graph-paper ground; your life runs down the page year by year;
   family trees read left (older) to right (newer); every link card leads with what the newer team added. */
:root{
  --target-size:24px;
  --paper:#EAF0F7; --grid:rgb(43 69 224 / .048); --card:#FFFFFF; --ink:#131726; --ink2:#363D50; --muted:#5D667A; --line:#D5DCE6; --line2:#A5AEBF;
  --accent:#1A63D8; --accent-ink:#FFFFFF; --accent-soft:#E1ECFF;
  --hook:#C8780A; --hook-ink:#FFFFFF; --hook-soft:#FEF1D8;
  --love:#DF3F2C; --love-ink:#FFFFFF; --love-soft:#FCE5E1;
  --craft:#0D7C66; --craft-ink:#FFFFFF; --craft-soft:#D9F4EC;
  --up:#E4ECFF; --up-ink:#1F3A8A; --down:#DCF1E6; --down-ink:#1B6244;
  --t-dev:#1A63D8; --t-team:#7A3FD1; --t-series:#69738D; --t-critic:#B06C0A; --t-mech:#0D8577; --t-disp:#C2332B;
  --shadow:0 10px 30px rgb(20 26 50 / .12);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (pointer:coarse){:root{--target-size:44px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141C; --grid:rgb(138 180 248 / .05); --card:#171F2C; --ink:#E8ECF6; --ink2:#C6CCDB; --muted:#95A0B5; --line:#263144; --line2:#46536B;
  --accent:#8AB4F8; --accent-ink:#0A101D; --accent-soft:#1C283E;
  --hook:#F5B041; --hook-ink:#1D1202; --hook-soft:#352710;
  --love:#FF6E5A; --love-ink:#1A0806; --love-soft:#3A1D1B;
  --craft:#38C9A8; --craft-ink:#051F19; --craft-soft:#12332C;
  --up:#182338; --up-ink:#ADC6FA; --down:#132920; --down-ink:#8FD7B4;
  --t-dev:#8AB4F8; --t-team:#B78DF6; --t-series:#A4AEC4; --t-critic:#E6A63F; --t-mech:#3EC4B1; --t-disp:#F26B61;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141C; --grid:rgb(138 180 248 / .05); --card:#171F2C; --ink:#E8ECF6; --ink2:#C6CCDB; --muted:#95A0B5; --line:#263144; --line2:#46536B;
  --accent:#8AB4F8; --accent-ink:#0A101D; --accent-soft:#1C283E;
  --hook:#F5B041; --hook-ink:#1D1202; --hook-soft:#352710;
  --love:#FF6E5A; --love-ink:#1A0806; --love-soft:#3A1D1B;
  --craft:#38C9A8; --craft-ink:#051F19; --craft-soft:#12332C;
  --up:#182338; --up-ink:#ADC6FA; --down:#132920; --down-ink:#8FD7B4;
  --t-dev:#8AB4F8; --t-team:#B78DF6; --t-series:#A4AEC4; --t-critic:#E6A63F; --t-mech:#3EC4B1; --t-disp:#F26B61;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}
html{scroll-padding-top:calc(3.5rem + env(safe-area-inset-top,0px));scroll-padding-bottom:calc(4.5rem + env(safe-area-inset-bottom,0px))}
html,body{background-color:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-wrap:break-word;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
.wrap{max-width:min(1380px,100%);margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
@media (max-width:480px){.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}}
@media (min-width:1800px){.wrap{max-width:1520px;padding-inline:max(28px,env(safe-area-inset-left,0px))}}
button{font:inherit;color:inherit;cursor:pointer}
:where(button.btn,button.chip,button.syschip,nav a,.artbtn,input,select,textarea){min-block-size:var(--target-size);box-sizing:border-box}
:where(nav a){display:inline-flex;align-items:center;justify-content:center}
:where(a,code){overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
p,dd,li{text-wrap:pretty}
input,select{font:inherit;color:var(--ink)}
.flag{font-family:var(--f-emoji);font-style:normal;font-weight:400;letter-spacing:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.logo i{width:22px;height:22px;background:var(--accent);border-radius:5px;position:relative;flex:none}
.logo i::before,.logo i::after{content:"";position:absolute;background:var(--accent-ink);border-radius:1px}
.logo i::before{left:5px;top:5px;width:4px;height:12px}
.logo i::after{left:9px;top:9px;width:8px;height:4px}
.logo b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo small{font-family:var(--f-pixel);font-size:10px;color:var(--muted);letter-spacing:.06em}
.tabs{display:flex;gap:3px;margin-left:auto;align-items:center}
.tab{border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.tab:hover{background:var(--accent-soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.artbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.artbtn:hover{border-color:var(--line2)}
.installbtn{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.installbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
[aria-disabled="true"]{opacity:.55;cursor:default}
.toputil{display:inline-flex;gap:5px;align-items:center;flex:none}
.sync{font-size:12px;color:var(--muted)}
@media (max-width:1160px){.logo small{display:none}}
@media (max-width:1060px){.topin{flex-wrap:wrap;gap:6px 8px;padding-block:8px}.tabs{width:100%;max-width:100%;min-width:0;margin:0;order:3;gap:4px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;text-align:center;padding:6px 11px;font-size:13px}.toputil{margin-left:auto}}
@media (max-width:440px){.logo b{font-size:14.5px}.tab{font-size:12.5px;padding:6px 10px}.artbtn{font-size:11px;padding:4px 7px}}

/* ---------- type & controls ---------- */
.eyebrow{font-family:var(--f-pixel);font-size:.73rem;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.75rem,1.1rem + 3.2vw,3rem);line-height:1.06;letter-spacing:-.02em;margin:0 0 12px}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.125rem,.95rem + 1.1vw,1.5rem);line-height:1.2;margin:0 0 4px}
.h3{font-weight:700;font-size:1rem;margin:0 0 4px}
.lede{font-size:clamp(.95rem,.88rem + .45vw,1.125rem);color:var(--ink2);max-width:60ch;margin:0 0 18px}
.sub{font-size:.9rem;color:var(--muted);margin:0 0 12px;max-width:68ch}
.sec{padding-block:26px 6px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechead > div{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.love{background:var(--love);border-color:var(--love);color:var(--love-ink)}
.btn.craft{background:var(--craft);border-color:var(--craft);color:var(--craft-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wrap{white-space:normal;text-align:center;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
button.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.craftchip[aria-pressed="true"]{background:var(--craft);color:var(--craft-ink);border-color:var(--craft)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.tierchip[aria-pressed="false"]{opacity:.55}
.chip.tierchip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.tierchip[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--c)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.input{width:100%;box-sizing:border-box;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:11px 13px;font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;container:cardcol / inline-size}
.empty{color:var(--muted);font-size:14px;margin:6px 0}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* ---------- search ---------- */
.search{position:relative;width:100%}
.search .input{padding-left:40px}
.search::before{content:"";position:absolute;left:14px;top:50%;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%);pointer-events:none}
.search::after{content:"";position:absolute;left:26px;top:50%;width:7px;height:2px;background:var(--muted);transform:translateY(5px) rotate(45deg);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,420px);max-height:min(60dvh,420px);overflow:auto;overscroll-behavior:contain;z-index:20;padding:4px}
.res{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.res:hover,.res.on{background:var(--accent-soft)}
.res .cv{width:30px}
.res b{font-weight:600;font-size:14.5px;display:block;line-height:1.25}
.res small{font-size:12px;color:var(--muted)}
.res .y{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.res .tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* ---------- covers ---------- */
.cv{--h:220;--ph:120;position:relative;display:block;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:5px;overflow:hidden;color:#fff;container-type:inline-size;isolation:isolate;flex:none;
  border:0;padding:0;text-align:left;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12),0 1px 2px rgb(0 0 0 / .18);
  background:linear-gradient(160deg,hsl(var(--h) 55% 40%),hsl(calc(var(--h) + 35) 60% 17%))}
.cv .ct{position:absolute;left:9%;right:9%;top:9%;z-index:2;font-family:var(--f-display);font-weight:700;line-height:1.08;font-size:clamp(5px,calc(11.5cqw * var(--k,1)),22px);
  overflow-wrap:anywhere;hyphens:auto;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgb(0 0 0 / .35)}
.cv .cy{position:absolute;right:8%;bottom:6%;z-index:2;font-family:var(--f-mono);font-size:clamp(5px,8cqw,13px);opacity:.85}
.cv .gl{position:absolute;left:8%;bottom:7%;z-index:2;width:21%;aspect-ratio:1;background:var(--gl) center/contain no-repeat;image-rendering:pixelated;opacity:.9}
@container (max-width:58px){.cv .ct,.cv .cy{display:none}.cv .gl{left:50%;top:50%;bottom:auto;width:44%;transform:translate(-50%,-50%)}}
.cv.e0{background:radial-gradient(120% 85% at 50% 38%,hsl(var(--ph) 65% 17%),#020503)}
.cv.e0 .ct{font-family:var(--f-pixel);font-weight:400;text-transform:uppercase;line-height:1.2;color:hsl(var(--ph) 95% 68%);text-shadow:0 0 6px hsl(var(--ph) 95% 50% / .6)}
.cv.e0 .gl{filter:drop-shadow(0 0 3px hsl(var(--ph) 95% 55%))}
.cv.e0::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgb(0 0 0 / .35) 0 1px,transparent 1px 3px)}
.cv.e1{background:hsl(var(--h) 22% 13%)}
.cv.e1::before{content:"";position:absolute;left:0;right:0;top:63%;height:17%;background:linear-gradient(180deg,hsl(var(--h) 85% 56%) 0 25%,hsl(calc(var(--h) + 28) 85% 56%) 25% 50%,hsl(calc(var(--h) + 56) 85% 56%) 50% 75%,hsl(calc(var(--h) + 84) 85% 56%) 75%)}
.cv.e2{background:hsl(var(--h) 58% 37%)}
.cv.e2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgb(0 0 0 / .17) 1px,transparent 1px),linear-gradient(90deg,rgb(0 0 0 / .17) 1px,transparent 1px);background-size:12.5% 9.375%}
.cv.e2::after{content:"";position:absolute;left:0;right:0;top:0;height:6%;background:#101014}
.cv.e2 .ct{top:13%;font-family:var(--f-pixel);font-weight:400;text-transform:uppercase;line-height:1.18}
@container (max-width:96px){.cv.e2 .ct{font-family:var(--f-display);font-weight:700;text-transform:none;line-height:1.08}}
.cv.e3::before{content:"";position:absolute;left:0;right:0;top:66%;height:2px;background:hsl(calc(var(--h) + 50) 95% 72%);box-shadow:0 0 14px 3px hsl(calc(var(--h) + 50) 95% 60% / .8)}
.cv.e4::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10%;background:#0B0C11;box-shadow:1px 0 0 rgb(255 255 255 / .22)}
.cv.e4 .ct{left:17%}
.cv.e4 .gl{left:17%}
.cv.e5::before{content:"";position:absolute;left:0;right:0;top:0;height:11%;background:linear-gradient(90deg,hsl(var(--h) 18% 93%),hsl(var(--h) 12% 80%))}
.cv.e5 .ct{top:18%}
.cv.e6{background:hsl(var(--h) 60% 45%);border-radius:7px}
.cv.e6 .gl{left:50%;top:40%;bottom:auto;width:42%;transform:translate(-50%,-50%);opacity:.95}
.cv.e6 .ct{top:auto;bottom:15%;font-size:clamp(5px,calc(10cqw * var(--k,1)),19px);-webkit-line-clamp:3}
.cv.e6 .cy{bottom:5%}
.cv .cimg{position:absolute;inset:0;z-index:4;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s ease-out;background:var(--card)}
.cv .cimg[src*=".svg.png"],.cv .cimg[src*="Logo."],.cv .cimg[src*="_logo."]{object-fit:contain;padding:12%;box-sizing:border-box;background:linear-gradient(155deg,#F2F5FB,#D5DCEB)}
.cv.hasimg .cimg{opacity:1}
.cv.hasimg .ct,.cv.hasimg .gl,.cv.hasimg .cy,.cv.hasimg::before,.cv.hasimg::after{opacity:0;transition:opacity .15s}
:root[data-art="era"] .cv .cimg{display:none}
:root[data-art="era"] .cv.hasimg .ct,:root[data-art="era"] .cv.hasimg .gl,:root[data-art="era"] .cv.hasimg .cy,:root[data-art="era"] .cv.hasimg::before,:root[data-art="era"] .cv.hasimg::after{opacity:1}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px}
@media (min-width:1400px){.grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:20px 14px}}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}}
@media (max-width:355px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.tile .artwrap{position:relative;width:100%}
.tile .art{position:relative;display:block;border:0;background:none;padding:0;width:100%;cursor:pointer;border-radius:6px}
.tile .tjump{position:absolute;right:4px;bottom:4px;z-index:6;width:24px;height:24px;border-radius:6px;border:1px solid rgb(255 255 255 / .28);background:rgb(15 20 28 / .78);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px);opacity:.88}
.tile .tjump::after{content:"";position:absolute;inset:-6px}
.tile .tjump:hover{opacity:1;background:var(--accent);color:var(--accent-ink)}
.tile .wkbadge{position:absolute;top:-7px;left:-6px;z-index:6;height:22px;border-radius:11px;padding:0 6px;display:inline-flex;align-items:center;gap:3px;background:var(--craft);color:var(--craft-ink);font-size:10.5px;font-weight:700;box-shadow:0 0 0 2px var(--paper)}
.tile .tn{font-size:12.5px;line-height:1.25;font-weight:600;overflow-wrap:break-word}
.tile .ts{font-size:11.5px;color:var(--muted);line-height:1.3}
.tile .tmem{font-size:11px;color:var(--accent);line-height:1.25;font-style:italic;overflow-wrap:break-word}
.tile .trole{font-size:11px;color:var(--craft);font-weight:600;line-height:1.25}
.tile.lv1 .cv{box-shadow:0 0 0 2px var(--accent)}
.tile.lv2 .cv{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--hook)}
.tile.lv3 .cv{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--love)}
.tile.worked .cv{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--craft)}
.lvb{position:absolute;top:-7px;right:-7px;z-index:6;min-width:24px;height:24px;box-sizing:border-box;border-radius:12px;padding:0 6px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;box-shadow:0 0 0 2px var(--paper)}
.lv2 > .art .lvb,.lv2 > .artwrap .lvb,.lvb.l2{background:var(--hook);color:var(--hook-ink)}
.lv3 > .art .lvb,.lv3 > .artwrap .lvb,.lvb.l3{background:var(--love);color:var(--love-ink)}
.tile .art:active .cv{transform:scale(.97)}
.tap-hint{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:6px 0 2px}
.tap-hint b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;padding:0 5px;margin-right:4px}
.tap-hint b.l2{background:var(--hook);color:var(--hook-ink)}
.tap-hint b.l3{background:var(--love);color:var(--love-ink)}

/* ---------- start / hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:44px 22px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 8px}}
.start{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;max-width:460px}
.start .field{flex:1 1 116px;min-inline-size:0}
.start .input{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;padding-block:10px}
.start .btn{padding:13px 18px;font-size:15px;flex:1 1 auto}

/* ---------- search ---------- */
function searchGames(q,{limit=8,treeOnly=false,catFirst=false,playOnly=false}={}){
  const v=norm(q),vr=normR(q);if(!v)return [];
  const words=fold(q).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const out=[];
  for(const g of G){
    if(treeOnly&&!g.tree)continue;
    if(playOnly&&!playable(g))continue;
    let s=-1;
    if(g.n===v||g.nr===vr)s=120;
    else if(g.n.startsWith(v)||g.nr.startsWith(vr))s=88;
    else if(g.aka&&g.aka.split(" ").some(a=>a===q.trim().toLowerCase()||norm(a)===v))s=110;
    else if(g.n.includes(v)||g.nr.includes(vr))s=60;
    else if(words.length>1){const tw=fold(g.title).toLowerCase().split(/[^a-z0-9]+/);if(words.every(w=>tw.some(t=>t.startsWith(w)||(ROMAN[t]&&String(ROMAN[t])===w))))s=55}
    if(s<0)continue;
    s+=g.pop*4+Math.min(g.inf,400)/50+(g.tree?6:0)+(catFirst&&g.cat?4:0);
    out.push([s,g]);
  }
  return out.sort((a,b)=>b[0]-a[0]).slice(0,limit).map(x=>x[1]);
}

/* the main line back in time: strongest evidence, staying within the genre family where possible,

const ROOT_W={dev:3,team:2.5,critic:2,mech:1.4,series:.9,disp:0};
/* fold runs of 3+ sequels into one step: keep the newest and oldest of the run */

    if(r>=3){out.push({g:chain[i].g,link:null,collapsed:{n:r-1,to:chain[i+r].g,via:chain.slice(i+1,i+r).map(s=>s.g)}});i+=r}
    else{out.push(chain[i]);i++}}
  return out}

/* step by step: at each game take the most relevant inspiration (strong evidence, same kind of game),
   with a bonus for branches whose ancestry reaches further back in time */
function rootsChain(i){
  const fam=new Map(),minY=new Map(),visiting=new Set();
  const F=v=>{if(!fam.has(v))fam.set(v,famOf(G[v]));return fam.get(v)};
  const ok=l=>tierOn(l)&&l.tier!=="disp"&&!l.minor;

    for(const l of UP[v])if(ok(l))m=Math.min(m,reach(l.from));visiting.delete(v);minY.set(v,m);return m};
  const steps=[];let v=i;const seen=new Set();

    seen.add(v);const fv=F(v),gv=G[v],sv=studio(gv).toLowerCase();let best=null,bs=-1e9;
    for(const l of UP[v]){if(!ok(l)||seen.has(l.from))continue;const p=G[l.from],fp=F(l.from);
      const aff=(p.gen.length===0||[...fp].some(x=>fv.has(x)))?1:fp.has(0)?.7:.25;
      const prim=p.gen.length&&gv.gen.length?(p.gen[0]===gv.gen[0]?.6:(gv.gen.includes(p.gen[0])||p.gen.includes(gv.gen[0]))?.25:0):0;
      const same=sv&&studio(p).toLowerCase()===sv?.5:0;
      const s=ROOT_W[l.tier]*aff+0.25*Math.min(6,(gv.year-reach(l.from))/10)+prim+same+0.05*p.pop;
      if(s>bs){bs=s;best=l}}

function gamerPersonaOf(d){

  const coopTags=es.filter(x=>(x.e.mtags||[]).some(t=>/co-op|friends|siblings|LAN|Arcade/i.test(t))).length;
  const avgPop=es.reduce((s,x)=>s+x.g.pop,0)/es.length;

    title="The Pure-Flow Kineticist";
    sketch="You judge a game in the first ten seconds by how good it feels in your hands. Tight controls, honest challenge, and entering a zen flow state beat bloated cutscenes every time.";
  }else if(["fps","shooter","battle-royale"].includes(g0)){

function dnaOf(d){
  const mine=entries(d).filter(x=>x.g);const set=new Set(mine.map(x=>x.g.i));const anc=new Map(),all=new Set();
  for(const x of mine){ancestors(x.g.i).forEach(a=>all.add(a));for(const a of nearAncestors(x.g.i)){const o=anc.get(a)||{n:0,w:0,kids:[]};o.n++;o.w+=x.lv;if(o.kids.length<3)o.kids.push(x.g);anc.set(a,o)}}
  const top=[...anc.entries()].map(([i,o])=>({g:G[i],...o,played:set.has(i)})).sort((a,b)=>b.n-a.n||b.w-a.w||a.g.year-b.g.year);
  let oldest=null;all.forEach(i=>{if(!oldest||G[i].year<oldest.g.year)oldest={g:G[i]}});
  const allCount=all.size;
  const gw={};mine.forEach(x=>x.g.gen.forEach((gi,k)=>{gw[gi]=(gw[gi]||0)+x.lv*(k?0.5:1)}));
  const genres=Object.entries(gw).map(([i,w])=>({gen:GEN[i],gi:+i,w})).sort((a,b)=>b.w-a.w);
  const topGenSet=new Set(genres.slice(0,3).map(x=>x.gi));
  const nextUp=[];const seenNext=new Set();
  mine.filter(x=>x.lv>=2).sort((a,b)=>b.lv-a.lv||b.g.pop-a.g.pop).forEach(x=>DOWN[x.g.i].forEach(l=>{const c=G[l.to];if(set.has(c.i)||seenNext.has(c.i)||c.year>NOW)return;seenNext.add(c.i);nextUp.push({g:c,because:x.g,s:c.pop*10+Math.min(c.inf,200)/20+(x.lv===3?8:0)+(l.tier==="dev"?4:0)})}));
  nextUp.sort((a,b)=>b.s-a.s);
  const indiePool=G.filter(g=>!set.has(g.i)&&g.year>=2012&&g.year<=NOW&&g.pop>=2&&g.pop<=3&&g.tree&&playable(g)&&g.gen.some(gi=>topGenSet.has(gi)));
  const indies=indiePool.map(g=>{
    const parentHit=UP[g.i].find(l=>set.has(l.from));
    return {g,why:parentHit?`Inspired by ${G[parentHit.from].title}`:GEN[g.gen[0]].label+" gem",s:(parentHit?30:0)+g.pop*8+UP[g.i].length*3+DOWN[g.i].length*4+(g.img?6:0)};
  }).sort((a,b)=>b.s-a.s).slice(0,8);
  const missed=top.filter(a=>!a.played&&a.g.pop>=3&&a.n>=2).slice(0,8);
  return {top,oldest,genres,nextUp:nextUp.slice(0,8),indies,missed,count:mine.length,allCount};
}

/* ---------- genres, mechanics, tabletop roots & game prices over time ---------- */
function cpiFactorTo2026(y){
  const tbl=(MW.prices&&MW.prices.cpi)||{1977:60.6,1980:82.4,1985:107.6,1990:130.7,1995:152.4,2000:172.2,2005:195.3,2010:218.1,2015:237,2020:258.8,2026:324};
  const ks=Object.keys(tbl).map(Number).sort((a,b)=>a-b);
  const c26=tbl[2026]||324;
  if(y<=ks[0])return c26/tbl[ks[0]];
  if(y>=ks[ks.length-1])return 1;
  for(let i=0;i<ks.length-1;i++){
    const a=ks[i],b=ks[i+1];
    if(y>=a&&y<=b){const t=(y-a)/(b-a),cpi=tbl[a]+t*(tbl[b]-tbl[a]);return c26/cpi}
  }
  return 1;
}
function estimateGamePrice(g){
  if(!g||!playable(g))return null;
  if(F2P_IDS.has(g.id)||/free-to-play/i.test(g.note||""))return {nom:0,real:0,kind:"Free-to-play"};
  const ps=sysOfGame(g);
  if(ps.length===1&&ps[0]==="Arcade")return {nom:0.25,real:+(0.25*cpiFactorTo2026(Math.max(1977,g.year))).toFixed(2),kind:"Arcade quarter",arcade:true};
  if(ps.every(p=>p==="iPhone / iPad"||p==="Android"||p==="Browser"))return {nom:2.99,real:Math.round(2.99*cpiFactorTo2026(g.year)),kind:"Mobile / web"};
  let nom=59.99;
  if(g.year<1983)nom=34.95;
  else if(g.year<1987)nom=ps.some(p=>/Commodore 64|ZX Spectrum|Amstrad|Amiga|Atari ST|PC/.test(p))?29.95:39.95;
  else if(g.year<1991)nom=ps.some(p=>/Amiga|Commodore 64|PC|Atari ST/.test(p))?39.95:49.99;
  else if(g.year<1996)nom=ps.some(p=>/SNES|Genesis|Neo Geo/.test(p))?64.99:44.99;
  else if(g.year<2000)nom=ps.includes("Nintendo 64")&&!ps.includes("PlayStation")?64.99:49.99;
  else if(g.year<2005)nom=49.99;
  else if(g.year<2020)nom=g.pop<=3?19.99:59.99;
  else nom=g.pop<=3?19.99:69.99;

  return `<section class="sec"><div class="card"><h2 class="h3">${esc(g.title)} isn't in the family tree yet</h2><p class="sub" style="margin:0">It's in the catalog, so you can add it to your timeline. Nobody has recorded what inspired it yet.</p></div>
    ${rel.length?`<h2 class="h2" style="margin-top:22px">Related games in the family tree</h2><p class="sub">Same kind of game, from around the same time.</p><div class="recs">${rel.map(r=>tileHTML(r,hist,{act:"game",quickTick:!!hist.birth})).join("")}</div>`:""}</section>`;
}
/* two generations each way, capped per column; ordered by year, with real box art thumbnails */
function treeSVG(g){
  const gen=new Map([[g.i,0]]),cols={"-2":[],"-1":[],"0":[g.i],"1":[],"2":[]};
  const imp=i=>G[i].pop*10+Math.min(G[i].inf,500)/10;
  const add=(i,k)=>{if(!gen.has(i)){gen.set(i,k);cols[k].push(i)}};
  UP[g.i].filter(tierOn).forEach(l=>add(l.from,-1));
  DOWN[g.i].filter(tierOn).forEach(l=>add(l.to,1));
  const cap=k=>state.treeMore["c"+k]?60:9;
  const trim=k=>{cols[k].sort((a,b)=>imp(b)-imp(a));const more=cols[k].length-cap(k);if(more>0){cols[k].slice(cap(k)).forEach(i=>gen.delete(i));cols[k]=cols[k].slice(0,cap(k))}return Math.max(0,more)};
  const more={"-1":trim(-1),"1":trim(1)};
  cols["-1"].forEach(i=>UP[i].filter(tierOn).forEach(l=>add(l.from,-2)));
  cols["1"].forEach(i=>DOWN[i].filter(tierOn).forEach(l=>add(l.to,2)));
  more["-2"]=trim(-2);more["2"]=trim(2);
  const ks=[-2,-1,0,1,2].filter(k=>cols[k].length);
  ks.forEach(k=>cols[k].sort((a,b)=>G[a].year-G[b].year||G[a].title.localeCompare(G[b].title)));
  const W=192,H=52,RG=10,CG=54,M=16,TOP=40;
  const maxRows=Math.max(...ks.map(k=>cols[k].length+(more[k]?1:0)));
  const pos=new Map();const colX={};ks.forEach((k,ci)=>colX[k]=M+ci*(W+CG));
  ks.forEach(k=>{const n=cols[k].length+(more[k]?1:0),off=(maxRows-n)/2*(H+RG);cols[k].forEach((i,r)=>pos.set(i,{x:colX[k],y:TOP+off+r*(H+RG)}))});
  const width=M*2+ks.length*(W+CG)-CG,height=TOP+maxRows*(H+RG)+10;
  const C=cssVar,ink=C("--ink"),muted=C("--muted"),line2=C("--line2"),card=C("--card"),paper=C("--paper"),acc=C("--accent"),accInk=C("--accent-ink"),upInk=C("--up-ink"),downInk=C("--down-ink");
  const useImg=document.documentElement.dataset.art!=="era";
  let defs="";
  for(const [i,p] of pos)if(useImg&&G[i].img)defs+=`<clipPath id="tc-${i}"><rect x="${p.x+7}" y="${p.y+6}" width="30" height="40" rx="4"/></clipPath>`;
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" style="display:block" role="img" aria-label="Family tree of ${esc(g.title)}">${defs?`<defs>${defs}</defs>`:""}`;
  const lab={"-2":"◂ Earlier ancestors","-1":"◂ Inspired it","0":"This game","1":"It inspired ▸","2":"Later descendants ▸"};
  ks.forEach(k=>{s+=`<text x="${colX[k]+W/2}" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="${k<0?upInk:k>0?downInk:ink}">${lab[k]}</text>`});
  const edges=L.filter(l=>tierOn(l)&&pos.has(l.from)&&pos.has(l.to)&&gen.get(l.to)-gen.get(l.from)===1);
  edges.forEach(l=>{const A=pos.get(l.from),B=pos.get(l.to),t=TIERS[l.t];const x1=A.x+W,y1=A.y+H/2,x2=B.x,y2=B.y+H/2,dx=Math.max(22,(x2-x1)/2);
    const touch=l.from===g.i||l.to===g.i;
    s+=`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${C(t.c)}" stroke-width="${touch?2.4:1.4}" ${t.dash?'stroke-dasharray="5 4"':""} opacity="${touch?.9:.45}"/>`});
  for(const [i,p] of pos){const n=G[i],isC=i===g.i;const t1=n.title.length>22?n.title.slice(0,21)+"…":n.title;const st=studio(n),t2=`${n.year} · ${st.length>16?st.slice(0,15)+"…":st}`;
    const myl=levelOf(hist,n),myw=isWorked(hist,n);
    s+=`<g class="wnode" data-act="game" data-id="${n.id}" ${isC?`data-center="1" data-cx="${p.x+W/2}"`:""} tabindex="0" role="link" aria-label="${esc(n.title)}, ${n.year}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="10" fill="${isC?acc:card}" stroke="${myw?C("--craft"):isC?acc:line2}" stroke-width="${myw?2:1}"/>
      <rect x="${p.x+7}" y="${p.y+6}" width="30" height="40" rx="4" fill="hsl(${n.h} 55% 40%)"/>
      ${useImg&&n.img?`<image href="${esc(n.img)}" x="${p.x+7}" y="${p.y+6}" width="30" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#tc-${i})"/>`:""}
      <text x="${p.x+44}" y="${p.y+21}" font-size="12.5" font-weight="700" fill="${isC?accInk:ink}">${esc(t1)}</text>
      <text x="${p.x+44}" y="${p.y+37}" font-size="10.5" fill="${isC?accInk:muted}">${esc(t2)}</text>
      ${myw||myl?`<circle cx="${p.x+W-10}" cy="${p.y+10}" r="7" fill="${myw?C("--craft"):myl===3?C("--love"):acc}"/><text x="${p.x+W-10}" y="${p.y+13.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${myw?C("--craft-ink"):paper}">${myw?"✦":myl===3?"♥":"✓"}</text>`:""}</g>`}
  ks.forEach(k=>{if(more[k]){const n=cols[k].length,off=(maxRows-n-1)/2*(H+RG),y=TOP+off+n*(H+RG);
    s+=`<g class="wnode" data-act="treeMore" data-col="${k}" tabindex="0" role="button"><rect x="${colX[k]}" y="${y}" width="${W}" height="${H}" rx="10" fill="none" stroke="${line2}" stroke-dasharray="4 3"/><text x="${colX[k]+W/2}" y="${y+30}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${muted}">+${more[k]} more</text></g>`}});
  return s+`</svg>`;
}

/* ---------- story mode: walk the roots (left = older, right = newer; starts at target game on right, click left to step back) ---------- */
let story=null;
function openStory(chain){const c=compressChain(chain).slice().reverse();story={chain:c,total:chain.length-1,k:c.length-1,dir:-1};drawStory();document.addEventListener("keydown",storyKeys)}
function closeStory(){story=null;$("#layer").innerHTML="";document.removeEventListener("keydown",storyKeys)}
function storyKeys(e){if(!story)return;if(e.key==="ArrowLeft"){storyStep(-1)}else if(e.key==="ArrowRight"){storyStep(1)}else if(e.key==="Escape")closeStory()}
function storyStep(d){if(!story)return;const n=story.chain.length,nk=Math.max(-1,Math.min(n-1,story.k+d));if(nk===story.k)return;story.dir=d;story.k=nk;drawStory()}
function drawStory(){
  const {chain,k,dir}=story,n=chain.length;
  const oldest=chain[0].g,newest=chain[n-1].g;
  const shortT=s=>s.length>(window.innerWidth<540?14:24)?s.slice(0,window.innerWidth<540?13:23)+"…":s;
  const prog=`<div class="stprog" role="group" aria-label="Lineage timeline (${oldest.year} on left to ${newest.year} on right)"><button type="button" class="${k===-1?"cur on":""}" data-act="storyJump" data-k="-1" title="Full lineage summary" aria-label="Full lineage summary"></button>${chain.map((st,j)=>`<button type="button" class="${j>=Math.max(0,k)?"on":""}${j===k?" cur":""}" data-act="storyJump" data-k="${j}" title="${st.g.year}: ${esc(st.g.title)}" aria-label="${st.g.year}: ${esc(st.g.title)}"></button>`).join("")}</div>`;
  const curG=k>=0?chain[k].g:null;
  let body;
  if(k<0){const studios=new Set(chain.map(s=>studio(s.g)).filter(Boolean)),cs=new Set(chain.map(s=>s.g.cc).filter(Boolean));
    body=`<div><p class="eyebrow">${oldest.year} ◂ ${newest.year} · Root walk complete</p><h2 class="h1" style="font-size:clamp(24px,4.5vw,38px)">${esc(oldest.title)} (${oldest.year}) → ${esc(newest.title)} (${newest.year})</h2>
      <p class="stsum">Starting at <b>${esc(newest.title)}</b> (${newest.year}) and walking back to <b>${esc(oldest.title)}</b> (${oldest.year}): <b>${newest.year-oldest.year} years</b>, ${plural(story.total,"step")}, ${plural(studios.size,"team")} in ${plural(cs.size,"country","countries")}. Every team stood on earlier craft and added something of their own.</p>
      <div class="row" style="margin-top:16px"><button class="btn primary wrap" data-act="game" data-id="${oldest.id}" data-close="1">Open ${esc(oldest.title)} (${oldest.year})</button><button class="btn wrap" data-act="game" data-id="${newest.id}" data-close="1">Open ${esc(newest.title)} (${newest.year})</button><button class="btn" data-act="storyRestart">Restart at ${esc(newest.title)} (${newest.year}) ▸</button><button class="btn" data-act="copyWalk" data-id="${newest.id}">Copy walk link</button></div></div>`}
  else{const s=chain[k],g=s.g,l=s.link,p=l?G[l.from]:null,t=l?TIERS[l.t]:null;
    const srcs=l?srcHTML(l.src,l.tier):"";
    const stepNote=k===n-1?`Starting point (${n} steps) — click <b>◂ Earlier</b> right below (or Left Arrow) to step back`:k===0?`Oldest recorded root (${oldest.year})`:`Step ${n-k+1} of ${n} · walking back from ${esc(newest.title)}`;
    body=`<div class="stin${dir<0?" back":""}" key="${k}">${cover(g)}<div style="min-width:0"><p class="eyebrow" style="margin-bottom:4px">${stepNote}</p><div class="styear">${g.year}</div><h2>${esc(g.title)}</h2>
      <p class="sub" style="margin:0">${flag(g.cc)} ${studioLinks(g.dev||"")}${hist.birth?` · ${g.year-hist.birth>=0?"first released when you were "+(g.year-hist.birth):(hist.birth-g.year)+" years before you were born"}`:""}</p>
      ${g.note?`<p class="gnote" style="font-size:14px">${esc(g.note)}</p>`:""}
      ${l?`<div class="stlink" style="--c:var(${t.c})"><p class="lead">Built on <b>${esc(p.title)}</b> (${p.year}) · <span class="tier">${t.label}</span></p><dl class="ta"><dt>${l.rel==="variant"||l.rel==="fast-follow"?"Changed":"Added"}</dt><dd class="add">${esc(l.added)}</dd><dt>Took</dt><dd>${esc(l.took)}</dd></dl>${srcs?`<div class="src">Source: ${srcs}</div>`:""}</div>`
        :s.collapsed?`<div class="stlink" style="--c:var(--t-series)"><p class="lead">Built on its own series: ${plural(s.collapsed.n,"game")} from <b>${esc(s.collapsed.to.title)}</b> (${s.collapsed.to.year}) · <span class="tier">Same series</span></p><p class="src" style="margin:4px 0 0">${esc(s.collapsed.via.map(v=>v.title+" ("+v.year+")").join(" ▸ "))}</p></div>`
        :`<div class="stlink" style="--c:var(--accent)"><p class="lead"><b>Origin point (${g.year}):</b> where the ${newest.year-oldest.year}-year road to ${esc(newest.title)} (${newest.year}) begins.</p></div>`}
    </div></div>`}
  const prevLbl=k>0?`◂ Earlier (${chain[k-1].g.year} · ${esc(shortT(chain[k-1].g.title))})`:k===0?`◂ Summary (${newest.year-oldest.year} yrs)`:"◂ Origin reached";
  const nextLbl=k<0?`Origin (${oldest.year}) ▸`:k<n-1?`Later (${chain[k+1].g.year}) ▸`:`At ${newest.year} ▸`;
  const prevTip=k>0?`Step back to ${chain[k-1].g.title} (${chain[k-1].g.year})`:"Summary";
  const nextTip=k<n-1?`Step forward to ${chain[Math.max(0,k+1)].g.title}`:"Latest step";
  $("#layer").innerHTML=`<div class="story" role="dialog" aria-label="Walk the roots"><div class="ststage">
    <div class="sthead"><button type="button" class="navback" data-act="closeStory">◂ Exit walk</button>${prog}<span class="mono muted sthead-yr" style="font-size:12px">${oldest.year} ◂ ${k>=0?chain[k].g.year:"Summary"} ▸ ${newest.year}</span><button class="x sthead-x" data-act="closeStory" aria-label="Close">×</button></div>
    <div class="stframe">
      <button type="button" class="stpad prev" data-act="storyPrev" ${k<0?"disabled":""} title="${esc(prevTip)}" aria-label="${esc(prevTip)}">◂</button>
      <div class="stcard" id="storyBody">
        <div class="stbody">${body}</div>
        <div class="stfoot">
          <div class="stfoot-nav">
            <button class="btn${k>=0?" primary":""}" data-act="storyPrev" ${k<0?"disabled":""}>${prevLbl}</button>
            <button class="btn${k<0?" primary":""}" data-act="storyNext" ${k>=n-1?"disabled":""}>${nextLbl}</button>
          </div>
          <div class="row stfoot-aux" style="gap:6px">
            ${curG?`<button type="button" class="btn sm ghost" data-act="game" data-id="${curG.id}" data-close="1">⑂ Family tree</button><button type="button" class="btn sm ghost" data-act="watchTv" data-id="${curG.id}">▶ Gameplay</button>`:""}
            <button type="button" class="btn sm ghost stfoot-close" data-act="closeStory">Exit</button>
          </div>
        </div>
      </div>
      <button type="button" class="stpad next" data-act="storyNext" ${k>=n-1?"disabled":""} title="${esc(nextTip)}" aria-label="${esc(nextTip)}">▸</button>
    </div>
  </div></div>`;
  const sb=$("#storyBody");
  if(sb){
    let sx=0,sy=0;
    sb.addEventListener("pointerdown",ev=>{sx=ev.clientX;sy=ev.clientY});
    sb.addEventListener("pointerup",ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)>54&&Math.abs(dx)>Math.abs(dy)*1.8)storyStep(dx>0?-1:1)});
  }
}

/* ---------- friends ---------- */
function overlap(a,b){const A=new Set(entries(a).map(x=>norm(x.e.t))),B=new Set(entries(b).map(x=>norm(x.e.t)));let both=0;A.forEach(k=>{if(B.has(k))both++});const uni=A.size+B.size-both;return {both,pct:uni?Math.round(both/uni*100):0}}
function friendCard(f){
  const d=f.data,es=entries(d),wk=es.filter(x=>x.e.wk),fav=es.filter(x=>x.lv===3&&x.g).sort((a,b)=>(b.g.pop)-(a.g.pop)).slice(0,5);
  const ov=hist.birth&&entries(hist).length?overlap(hist,d):null;
  return `<button class="fcard" data-act="friend" data-key="${esc(f.key)}"><span class="who"><span class="avatar" style="--h:${hueOf(String(f.name))}">${esc(String(f.name||"?").trim().charAt(0).toUpperCase()||"?")}</span><span><b>${esc(f.name)}</b><small>Born ${esc(d.birth)} · ${plural(es.length,"game")}${wk.length?` · 🛠 ${wk.length}`:""}</small></span></span>
    <span class="covers">${(fav.length?fav:es.filter(x=>x.g).slice(0,5)).map(x=>cover(x.g,{showYear:false})).join("")}</span>
    <span class="foot"><span>${f.src==="wall"?"On the friends wall":f.src==="db"?"Synced":"Opened from a link"}</span>${ov?`<span class="pill">${ov.pct}% in common</span>`:""}</span></button>`;
}
function renderFriends(m){
  const fl=friendList(),mine=hist.birth&&entries(hist).length;

    <p class="lede">Send your timeline link to friends. When they open it they can see your games, make their own, and compare. ${CAPS.owner?"Open a friend's link and pin it to the friends wall, so everyone who opens this page sees it.":""}</p>
    <div class="row">${mine?`<button class="btn primary" data-act="share">Share my timeline</button>`:`<a class="btn primary" href="#timeline">Make my timeline first</a>`}</div></section>

/* the crew together: what most of you played, and what you loved most */
function crewSection(fl){
  const people=[...fl.map(f=>({name:f.name,data:f.data}))];if(hist.birth&&entries(hist).length)people.unshift({name:"You",data:hist});
  if(people.length<2)return "";
  const cnt=new Map();
  people.forEach(p=>{const seenK=new Set();entries(p.data).forEach(x=>{if(!x.g||seenK.has(x.g.i))return;seenK.add(x.g.i);const o=cnt.get(x.g.i)||{g:x.g,n:0,love:0,who:[]};o.n++;if(x.lv===3){o.love++;o.who.push(p.name)}cnt.set(x.g.i,o)})});
  const all=[...cnt.values()];
  const most=all.filter(o=>o.n>=2).sort((a,b)=>b.n-a.n||b.love-a.love||b.g.pop-a.g.pop).slice(0,12);
  const loved=all.filter(o=>o.love>=1).sort((a,b)=>b.love-a.love||b.n-a.n).slice(0,8);
  const tile=(o,line)=>`<div class="tile"><button class="art" data-act="game" data-id="${o.g.id}">${cover(o.g)}</button><span class="tn">${esc(o.g.title)}</span><span class="why">${line}</span></div>`;
  return `<section class="wrap sec"><p class="eyebrow">The crew</p><h2 class="h2">${people.length} timelines together</h2><p class="sub">${all.length.toLocaleString()} different games between you.</p>
    ${most.length?`<h3 class="h3" style="margin-top:14px">Played by most of you</h3><div class="recs">${most.map(o=>tile(o,`${o.n} of ${people.length}`)).join("")}</div>`:""}
    ${loved.length?`<h3 class="h3" style="margin-top:18px">The crew's favorites</h3><div class="recs">${loved.map(o=>tile(o,`♥ ${esc(o.who.slice(0,3).join(", "))}${o.who.length>3?" +"+(o.who.length-3):""}`)).join("")}</div>`:""}</section>`;
}
function friendsWhoPlayed(g){const out=[];friendList().forEach(f=>{const e=entryOf(f.data,g);if(e)out.push({name:f.name,lv:lvOf(e),wk:!!e.wk,role:e.role||""})});return out}
function findFriend(key){return friendList().find(f=>f.key===key)}
function renderShared(m,payload){

  if(!seen.some(s=>s.payload===payload)){seen.unshift({payload,at:Date.now()});seen=seen.slice(0,30);store.set("ib2-seen",seen)}

}

    <div class="wrap" id="adoptBox"></div>

    ${mk?`<section class="wrap" style="margin-top:10px;display:flex;justify-content:flex-end"><span class="seg" role="group" aria-label="Timeline filter"><button data-act="tlMode" data-m="all" aria-pressed="${!wkMode}">All games (${st.n})</button><button data-act="tlMode" data-m="worked" aria-pressed="${wkMode}">🛠 Worked on (${st.wk})</button></span></section>`:""}
    ${!wkMode?personaSection(d,false):""}
    ${wkMode?makerSection(d,false,mk):""}
    <section class="wrap life">${lifeStrip(d,{mine:false,workedOnly:wkMode})}</section>
    ${!wkMode&&mk?makerSection(d,false,mk):""}
    ${favSection(d,false)}${pyramidSection(d,false,st.n>=3?dnaOf(d):null)}${dnaSection(d,false)}${statsSection(d,false)}${footer()}`;
  state.viewing=f;

function openCompare(f){

function eraBoxContext(g){
  if(!playable(g))return "Tabletop boxed set / rulebook";
  if(F2P_IDS.has(g.id)||/free-to-play/i.test(g.note||""))return "Free-to-play live release · digital download";
  const ps=sysOfGame(g);
  if(ps.length===1&&ps[0]==="Arcade")return "Coin-operated arcade cabinet · typically 25¢ / credit";
  if(ps.every(p=>p==="iPhone / iPad"||p==="Android"||p==="Browser"))return "Mobile / web release · digital storefront";
  if(g.year<1984)return "Early big-box / ROM cartridge · typical launch MSRP $29–$39";
  if(g.year<1995){
    const comp=ps.some(p=>/Amiga|Commodore 64|Atari ST|ZX Spectrum|PC|Apple II/.test(p));
    return comp?'Big-box floppy / cassette with printed manual · typical MSRP $39–$49':'Printed cardboard box & ROM cartridge · typical launch MSRP $49–$59';
  }
  if(g.year<2005)return "Jewel-case / big-box CD-ROM or console keep-case · typical MSRP $49";
  if(g.year<2020)return g.pop<=3?"Digital / indie release · typical launch $15–$29":"Keep-case disc & digital storefront · typical launch MSRP $59";
  return g.pop<=3?"Digital / indie release · typical launch $15–$35":"Physical & digital edition · typical launch MSRP $59–$69";
}
const LIBRETRO_SYS={"Amiga":"Commodore - Amiga","Commodore 64":"Commodore - 64","Atari ST":"Atari - ST","ZX Spectrum":"Sinclair - ZX Spectrum","MSX":"Microsoft - MSX","NES":"Nintendo - Nintendo Entertainment System","SNES":"Nintendo - Super Nintendo Entertainment System","Nintendo 64":"Nintendo - Nintendo 64","Game Boy":"Nintendo - Game Boy","Game Boy Color":"Nintendo - Game Boy Color","Game Boy Advance":"Nintendo - Game Boy Advance","Nintendo DS":"Nintendo - Nintendo DS","GameCube":"Nintendo - GameCube","Master System":"Sega - Master System - Mark III","Mega Drive / Genesis":"Sega - Mega Drive - Genesis","Saturn":"Sega - Saturn","Dreamcast":"Sega - Dreamcast","PlayStation":"Sony - PlayStation","PlayStation 2":"Sony - PlayStation 2","PSP":"Sony - PlayStation Portable","Atari 2600":"Atari - 2600","TurboGrafx-16":"NEC - PC Engine - TurboGrafx 16","Neo Geo":"SNK - Neo Geo","Arcade":"MAME"};

function probeImgOk(url,ms=2800){
  return new Promise(res=>{
    const im=new Image();let done=false;
    const fin=ok=>{if(!done){done=true;res(ok)}};
    const tm=setTimeout(()=>fin(false),ms);
    im.onload=()=>{clearTimeout(tm);fin(im.naturalWidth>40&&im.naturalHeight>40)};
    im.onerror=()=>{clearTimeout(tm);fin(false)};
    im.src=url;
  });
}
async function fetchWikiGallery(g){
  const skip=/(Gnome-|Symbol_|Commons-logo|Wikiquote|Portal|Question_book|Crystal_Clear|Edit-clear|Nuvola|Flag_of_|Ambox|Lock-|Padlock|Disambig|Wiki_letter|Speaker_Icon|Loudspeaker|\.svg$)/i;
  const parseList=d=>{
    const out=[];
    for(const it of (d&&d.items||[])){
      if(it.type!=="image"||!it.title||skip.test(it.title))continue;
      const ss=it.srcset||[];if(!ss.length)continue;
      const best=ss[ss.length-1].src||ss[0].src,thumb=ss[0].src;
      const full=best.startsWith("//")?"https:"+best:best,th=thumb.startsWith("//")?"https:"+thumb:thumb;
      const cap=((it.caption&&it.caption.text)||"").trim();
      const isPerson=/\b(portrait|at the \d{4}|in \d{4}|Expo|GDC|E3|designer|director|composer|creator|programmer|founder)\b/i.test(cap+" "+it.title);
      out.push({src:full,thumb:th,kind:isPerson?"Creator / Team":"Screenshot / Art",cap:cap||it.title.replace(/^File:/,"").replace(/[_-]/g," ").replace(/\.\w+$/,"")});
    }
    return out;
  };
  const trySlug=async slug=>{
    try{const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(slug)}`);if(!r.ok)return [];return parseList(await r.json())}catch(e){return []}
  };
  const baseSlug=g.title.replace(/\s+/g,"_");
  let hits=await trySlug(`${baseSlug}_(video_game)`);
  if(hits.length<2){const h2=await trySlug(baseSlug);if(h2.length>hits.length)hits=h2}
  if(!hits.length){
    try{
      const sr=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(g.title+" "+g.year+" video game")}&srlimit=1&format=json&origin=*`);
      if(sr.ok){const sd=await sr.json(),top=sd?.query?.search?.[0]?.title;if(top)hits=await trySlug(top.replace(/\s+/g,"_"))}
    }catch(e){}
  }
  return hits;
}
async function fetchGameGallery(g){
  if(!g)return [];
  if(GAL_CACHE.has(g.id))return GAL_CACHE.get(g.id);
  const items=[];
  if(g.img){
    const hi=g.img.replace(/\/(\d{2,3})px-/,(m,w)=>+w<500?"/500px-":m);
    items.push({src:hi,thumb:g.img,kind:"Front Box / Cover",cap:`${g.title} (${g.year})`,box:true});
  }
  const stm=g.img&&g.img.match(/\/steam\/apps\/(\d+)\//);
  const probes=[];
  if(stm){
    const aid=stm[1];
    probes.push((async()=>{const u=`https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${aid}/library_hero.jpg`;return (await probeImgOk(u))?{src:u,thumb:u,kind:"Key Artwork",cap:`${g.title} widescreen banner`}:null})());
  }
  const ps=sysOfGame(g);
  const lrSys=ps.map(p=>LIBRETRO_SYS[p]||(p==="PC"&&g.year<=1997?"DOS":null)).filter(Boolean).slice(0,2);
  if(lrSys.length){
    const safeName=g.title.replace(/[:/&*?<>|\\"]/g,"_");
    for(const kind of [["Named_Snaps","In-Game Screenshot"],["Named_Titles","Title Screen"]]){
      probes.push((async()=>{
        for(const sys of lrSys){
          for(const reg of [" (USA)"," (Europe)"," (World)"," (USA, Europe)",""]){
            const u=`https://thumbnails.libretro.com/${encodeURIComponent(sys)}/${kind[0]}/${encodeURIComponent(safeName+reg)}.png`;
            if(await probeImgOk(u,2400))return {src:u,thumb:u,kind:kind[1],cap:`${g.title} — ${kind[1].toLowerCase()} (${sys.split(" - ").pop()})`};
          }
        }
        return null;
      })());
    }
  }
  const [wikiHits,...probeHits]=await Promise.all([fetchWikiGallery(g),...probes]);
  probeHits.filter(Boolean).forEach(h=>items.push(h));
  const seenFile=new Set(items.map(x=>x.src.split("/").pop().replace(/^\d+px-/,"").toLowerCase()));
  wikiHits.forEach(w=>{
    const fn=w.src.split("/").pop().replace(/^\d+px-/,"").toLowerCase();
    if(seenFile.has(fn)||items.length>=8)return;
    seenFile.add(fn);items.push(w);
  });
  GAL_CACHE.set(g.id,items);
  return items;
}

function extractYtId(s){
  const v=String(s||"").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;
  const m=v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:"";
}
const YT_LIVE_CACHE=new Map();
async function tryLiveGameplayId(g){
  if(YT_LIVE_CACHE.has(g.id))return YT_LIVE_CACHE.get(g.id);
  const q=encodeURIComponent(`${g.title} ${g.year} gameplay`);
  const hosts=["https://pipedapi.kavin.rocks","https://pipedapi.adminforge.de"];
  for(const h of hosts){
    try{
      const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),3200);
      const r=await fetch(`${h}/search?q=${q}&filter=videos`,{signal:ctrl.signal});
      clearTimeout(tm);
      if(!r.ok)continue;
      const d=await r.json();
      const hit=(d&&d.items||[]).find(it=>it&&typeof it.url==="string"&&it.url.includes("v="));
      const id=hit?extractYtId(hit.url):"";
      if(id){YT_LIVE_CACHE.set(g.id,id);return id}
    }catch(e){}
  }
  YT_LIVE_CACHE.set(g.id,"");
  return "";
}

      </div>

    </div>

    </div>
    <div class="hgrid" style="margin-bottom:10px">
      <label class="field" for="lstTitle">List title<input class="input" id="lstTitle" maxlength="48" value="${esc(cur.title||"")}"></label>
      <label class="field" for="lstAuthor">Byline (optional)<input class="input" id="lstAuthor" maxlength="24" placeholder="Your first name" value="${esc(cur.author||hist.name||"")}"></label>

    <label class="field" for="lstSub">Short subtitle / theme<input class="input" id="lstSub" maxlength="80" value="${esc(cur.sub||"")}"></label>
    <div class="search" style="margin-top:12px"><input class="input" id="lstGameQ" type="search" placeholder="Add a game to this list (e.g. Battletoads, Sekiro, Ghosts 'n Goblins, Outer Wilds)…" autocomplete="off"><div class="results" id="lstGameR" hidden></div></div>
    <div style="margin-top:12px">
      ${(cur.items||[]).length?cur.items.map((it,idx)=>{const g=byId.get(it.id);if(!g)return "";
        return `<div class="anc" style="grid-template-columns:28px 44px minmax(0,1fr) auto;gap:10px"><span class="mono muted" style="text-align:right">${idx+1}</span>${cover(g,{showYear:false})}
          <div style="min-width:0"><b>${esc(g.title)} <span class="mono muted" style="font-weight:400;font-size:12px">(${g.year})</span></b>
            <input class="input" data-lstnote="${idx}" maxlength="60" style="margin-top:4px;padding:4px 8px;font-size:12.5px" placeholder="Optional quip, e.g. Turbo Tunnel broke me at age 9…" value="${esc(it.note||"")}">
          </div>
          <span class="row" style="gap:4px"><button type="button" class="btn sm" data-act="listUp" data-i="${idx}" ${idx===0?"disabled":""} aria-label="Move up">▲</button><button type="button" class="btn sm" data-act="listDown" data-i="${idx}" ${idx===cur.items.length-1?"disabled":""} aria-label="Move down">▼</button><button type="button" class="btn sm ghost" data-act="listRm" data-i="${idx}" aria-label="Remove">×</button></span></div>`}).join("")
      :`<p class="empty" style="margin:12px 0">No games in this list yet — search above to add up to 16 games.</p>`}
    </div>

    <div id="lstImgOut"></div>`,"Custom themed lists",{wide:true});

    cur.title=($("#lstTitle")||{}).value?.trim().slice(0,48)||"My Game List";
    cur.author=($("#lstAuthor")||{}).value?.trim().slice(0,24)||"";

function initBoxPile(d){

}

function preloadCoverImages(games,timeoutMs=4500){

  if(!urls.length)return Promise.resolve(new Map());
  const map=new Map();
  return new Promise(resolve=>{
    let left=urls.length,done=false;
    const finish=()=>{if(!done){done=true;resolve(map)}};
    const tm=setTimeout(finish,timeoutMs);
    urls.forEach(u=>{
      const im=new Image();

      im.onload=()=>{if(im.naturalWidth>20&&im.naturalHeight>20)map.set(u,im);if(--left<=0){clearTimeout(tm);finish()}};

async function exportCanvasPng(gamesToPreload,buildFn,fname,outSel){
  toast("Rendering high-res image with box art…");
  const imgMap=await preloadCoverImages(gamesToPreload);
  let blob=null;
  try{
    const cv=buildFn(imgMap);
    blob=await new Promise((res,rej)=>{try{cv.toBlob(b=>b?res(b):rej(new Error("empty")),"image/png")}catch(err){rej(err)}});
  }catch(e){
    const cv2=buildFn(null);
    blob=await new Promise(r=>cv2.toBlob(r,"image/png"));
  }
  if(!blob){toast("Couldn't generate image");return}
  try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:fname,data:blob});toast("Saved "+fname);return}}catch(e){if(e&&e.code==="declined")return}
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  toast(`Downloaded ${fname}`);
  const out=outSel?$(outSel):null;
  if(out)out.innerHTML=`<p class="sub" style="margin-top:12px">Downloaded <b>${esc(fname)}</b> (on phones, press and hold the preview below to save to Photos).</p><img class="imgprev" src="${url}" alt="${esc(fname)}">`;
}

  dlJson(){const blob=new Blob([JSON.stringify(packHist(hist),null,2)],{type:"application/json"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`played-and-made-timeline-${hist.name?slugStudio(hist.name):hist.birth||"backup"}.json`;document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded")},
  adoptAsk(){const f=state.viewing;if(!f||!f.data)return;if(!entries(hist).length){hist=JSON.parse(JSON.stringify(f.data));save();toast("Loaded as your timeline");go("timeline");return}$("#adoptBox").innerHTML=`<div class="banner"><p>Replace your current timeline on this device (${plural(entries(hist).length,"game")}) with <b>${esc(f.name)}'s</b> (${plural(entries(f.data).length,"game")})?</p><div class="row"><button class="btn primary" data-act="adoptDo">Yes, load it</button><button class="btn" data-act="adoptNo">Cancel</button></div></div>`},
  adoptDo(){const f=state.viewing;if(!f||!f.data)return;hist=JSON.parse(JSON.stringify(f.data));save();toast("Loaded as your timeline");go("timeline")},
  adoptNo(){const b=$("#adoptBox");if(b)b.innerHTML=""},

  pileToss(){if(PILE&&PILE.toss)PILE.toss()},

  settings(){openSettings()},
  top10(){openTop10()},
  t10add(el){if((hist.top10||[]).length>=10)return;hist.top10=[...(hist.top10||[]),el.dataset.k];save();openTop10()},
  t10rm(el){hist.top10=(hist.top10||[]).filter(k=>k!==el.dataset.k);save();openTop10()},
  t10up(el){const a=hist.top10,i=a.indexOf(el.dataset.k);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();openTop10()}},
  t10down(el){const a=hist.top10,i=a.indexOf(el.dataset.k);if(i>=0&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();openTop10()}},
  theme(){const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";store.set("ib2-theme",r.dataset.theme);syncThemeColor()},
  async installApp(el){
    if(!el||el.getAttribute("aria-disabled")==="true")return;
    el.setAttribute("aria-disabled","true");
    try{
      if(PWA.supportsWebInstall){
        await navigator.install();
        PWA.installed=true;
        announceInstallStatus("The app was installed or opened.");
        syncInstallUI();
      }else if(PWA.deferred){
        const promptEvent=PWA.deferred;
        PWA.deferred=undefined;
        await promptEvent.prompt();
        const {outcome}=await promptEvent.userChoice;
        if(outcome==="accepted"){
          PWA.installed=true;
          announceInstallStatus("Played & Made installed.");
        }else{
          announceInstallStatus("Installation canceled.");
        }
        syncInstallUI();
      }
    }catch(err){
      if(err&&err.name==="AbortError"){
        announceInstallStatus("Installation was canceled or could not complete.");
      }else{
        announceInstallStatus("Installation could not start.");
        console.error(err);
      }
    }finally{
      el.removeAttribute("aria-disabled");
    }
  },
  resetAsk(){$("#resetBox").innerHTML=`<div class="banner"><p>Clear all ${plural(entries(hist).length,"game")} from your timeline?</p><div class="row"><button class="btn love" data-act="resetDo">Clear it</button><button class="btn" data-act="resetNo">Keep it</button></div></div>`},
  resetNo(){$("#resetBox").innerHTML=""},
  resetDo(){hist=blankHist();save();store.del("ib2-revealed");clearLayer();go("start");render();toast("Cleared")},

  moreLinks(el){state.treeMore[el.dataset.dir]=1;render()},
  treeMore(el){state.treeMore["c"+el.dataset.col]=1;render()},
  closeStory(){closeStory()},storyNext(){storyStep(1)},storyPrev(){storyStep(-1)},storyRestart(){if(story){story.dir=1;story.k=story.chain.length-1;drawStory()}},storyJump(el){if(story){const nk=+el.dataset.k;story.dir=nk<story.k?-1:1;story.k=nk;drawStory()}},
  friend(el){const f=findFriend(el.dataset.key);if(!f)return;if(f.src==="seen"&&f.payload)go(f.payload);else go(friendHash(f))},
  forget(el){const p=el.dataset.payload;seen=seen.filter(s=>s.payload!==p);store.set("ib2-seen",seen);DEC.delete(p);toast("Removed from this device");go("friends")},
  compare(el){const f=state.viewing;if(f)openCompare(f)},
  pin(){const f=state.viewing;if(!f||!CAPS.db)return;const id=("f-"+norm(f.name||"friend").slice(0,20)+"-"+f.data.birth).replace(/[^a-z0-9-]/g,"");
    CAPS.db.doc("crew/"+id).set({...packHist(f.data),name:f.name,pinnedAt:Date.now()}).then(()=>toast(`Pinned ${f.name} to the friends wall`)).catch(()=>toast("Couldn't pin. Only the page owner can."))},
  unpin(el){if(!CAPS.db)return;CAPS.db.doc("crew/"+el.dataset.doc).delete().then(()=>{toast("Unpinned");go("friends")}).catch(()=>toast("Couldn't unpin"))}
};
async function copyText(v,input){try{await navigator.clipboard.writeText(v);toast("Copied to clipboard")}catch(e){if(input){input.focus();input.select()}toast("Select the text and copy it")}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACTIONS[el.dataset.act];if(!fn)return;
  if(el.tagName==="A")e.preventDefault();fn(el,e)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!story&&$("#layer").innerHTML){e.preventDefault();closeLayer();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g.wnode")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ---------- PWA install, theme-color sync & offline service worker ---------- */
const PWA={
  supportsWebInstall:typeof Navigator!=="undefined"&&typeof Navigator.prototype.install==="function",
  deferred:undefined,
  installed:false
};
function isStandaloneApp(){
  return !!(PWA.installed||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true);
}
function canInstallApp(){
  return !isStandaloneApp()&&(PWA.supportsWebInstall||!!PWA.deferred);
}
function announceInstallStatus(msg){
  const sr=$("#srLive");if(sr)sr.textContent=msg;
  toast(msg);
}
function syncInstallUI(){
  const show=canInstallApp();
  document.querySelectorAll("[data-install-ui]").forEach(el=>{el.hidden=!show});
}
function syncThemeColor(){
  const explicit=document.documentElement.dataset.theme;
  const dark=explicit?explicit==="dark":(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  const col=dark?"#0F141C":"#EAF0F7";
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(explicit)m.removeAttribute("media");
    if(!m.getAttribute("media"))m.setAttribute("content",col);
  });
}
window.addEventListener("beforeinstallprompt",ev=>{
  ev.preventDefault();
  PWA.deferred=ev;
  if(!PWA.supportsWebInstall)syncInstallUI();
});
window.addEventListener("appinstalled",()=>{
  PWA.installed=true;
  PWA.deferred=undefined;
  syncInstallUI();
  announceInstallStatus("Played & Made installed — launch anytime from your apps or home screen.");
});
if(window.matchMedia){
  const mq=window.matchMedia("(display-mode: standalone)");
  if(mq.addEventListener)mq.addEventListener("change",()=>syncInstallUI());
}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});
  });
}

/* ---------- boot & native <dialog closedby="any"> Safari fallback ---------- */
(()=>{
  const t=store.get("ib2-theme");if(t)document.documentElement.dataset.theme=t;
  const a=store.get("ib3-art");if(a)document.documentElement.dataset.art=a;
  syncThemeColor();
  syncInstallUI();
  updateArtBtn();
  updateAudioBtns();
  const dlg=$("#sheetDlg");
  if(dlg){
    dlg.addEventListener("close",()=>{
      dlg.returnValue="";dlg.classList.remove("wide");dlg.innerHTML="";
      if(state.route.view==="timeline"||state.route.view==="start"){const y=window.scrollY;render();window.scrollTo({top:y})}
    });
    if(!("closedBy" in HTMLDialogElement.prototype)){
      const outside=(ev,d)=>{const r=d.getBoundingClientRect();return ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom};
      let pressedOutside=false;
      dlg.addEventListener("pointerdown",ev=>{pressedOutside=outside(ev,dlg)});
      dlg.addEventListener("pointerup",ev=>{if(pressedOutside&&outside(ev,dlg))dlg.close()});
    }
  }
})();
route();
initCaps();
