<title>Inspired By</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: a game designer's notebook. Graph-paper ground; your life runs down the page year by year;
   family trees read left (older) to right (newer); every link card leads with what the newer team added. */
:root{
  --paper:#EAF0F7; --grid:rgb(43 69 224 / .048); --card:#FFFFFF; --ink:#131726; --ink2:#363D50; --muted:#5D667A; --line:#D5DCE6; --line2:#A5AEBF;
  --accent:#1A63D8; --accent-ink:#FFFFFF; --accent-soft:#E1ECFF;
  --hook:#C8780A; --hook-ink:#FFFFFF; --hook-soft:#FEF1D8;
  --love:#DF3F2C; --love-ink:#FFFFFF; --love-soft:#FCE5E1;
  --up:#E4ECFF; --up-ink:#1F3A8A; --down:#DCF1E6; --down-ink:#1B6244;
  --t-dev:#1A63D8; --t-team:#7A3FD1; --t-series:#69738D; --t-critic:#B06C0A; --t-mech:#0D8577; --t-disp:#C2332B;
  --shadow:0 10px 30px rgb(20 26 50 / .12);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141C; --grid:rgb(138 180 248 / .05); --card:#171F2C; --ink:#E8ECF6; --ink2:#C6CCDB; --muted:#95A0B5; --line:#263144; --line2:#46536B;
  --accent:#8AB4F8; --accent-ink:#0A101D; --accent-soft:#1C283E;
  --hook:#F5B041; --hook-ink:#1D1202; --hook-soft:#352710;
  --love:#FF6E5A; --love-ink:#1A0806; --love-soft:#3A1D1B;
  --up:#182338; --up-ink:#ADC6FA; --down:#132920; --down-ink:#8FD7B4;
  --t-dev:#8AB4F8; --t-team:#B78DF6; --t-series:#A4AEC4; --t-critic:#E6A63F; --t-mech:#3EC4B1; --t-disp:#F26B61;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141C; --grid:rgb(138 180 248 / .05); --card:#171F2C; --ink:#E8ECF6; --ink2:#C6CCDB; --muted:#95A0B5; --line:#263144; --line2:#46536B;
  --accent:#8AB4F8; --accent-ink:#0A101D; --accent-soft:#1C283E;
  --hook:#F5B041; --hook-ink:#1D1202; --hook-soft:#352710;
  --love:#FF6E5A; --love-ink:#1A0806; --love-soft:#3A1D1B;
  --up:#182338; --up-ink:#ADC6FA; --down:#132920; --down-ink:#8FD7B4;
  --t-dev:#8AB4F8; --t-team:#B78DF6; --t-series:#A4AEC4; --t-critic:#E6A63F; --t-mech:#3EC4B1; --t-disp:#F26B61;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}
html,body{background-color:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
input,select{font:inherit;color:var(--ink)}
.flag{font-family:var(--f-emoji);font-style:normal;font-weight:400;letter-spacing:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.logo i{width:22px;height:22px;background:var(--accent);border-radius:5px;position:relative;flex:none}
.logo i::before,.logo i::after{content:"";position:absolute;background:var(--accent-ink);border-radius:1px}
.logo i::before{left:5px;top:5px;width:4px;height:12px}
.logo i::after{left:9px;top:9px;width:8px;height:4px}
.logo b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo small{font-family:var(--f-pixel);font-size:10px;color:var(--muted);letter-spacing:.06em}
.tabs{display:flex;gap:3px;margin-left:auto;align-items:center}
.tab{border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.tab:hover{background:var(--accent-soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.artbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.artbtn:hover{border-color:var(--line2)}
.sync{font-size:12px;color:var(--muted)}
@media (max-width:740px){.logo small{display:none}.tab{padding:6px 9px;font-size:13px}}
@media (max-width:580px){.topin{flex-wrap:wrap;gap:6px 8px;padding-block:8px}.tabs{width:100%;margin:0;order:3}.tab{flex:1;text-align:center;padding:6px 3px;font-size:13px}.artbtn{margin-left:auto}}

/* ---------- type & controls ---------- */
.eyebrow{font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5.6vw,46px);line-height:1.06;letter-spacing:-.02em;margin:0 0 12px}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3.2vw,22px);line-height:1.2;margin:0 0 4px}
.h3{font-weight:700;font-size:15px;margin:0 0 4px}
.lede{font-size:clamp(15px,2.2vw,17px);color:var(--ink2);max-width:58ch;margin:0 0 18px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 12px;max-width:68ch}
.sec{padding-block:26px 6px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechead > div{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.love{background:var(--love);border-color:var(--love);color:var(--love-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wrap{white-space:normal;text-align:center;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
button.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.tierchip[aria-pressed="false"]{opacity:.55}
.chip.tierchip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.tierchip[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--c)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.input{width:100%;box-sizing:border-box;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:11px 13px;font-size:16px}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.empty{color:var(--muted);font-size:14px;margin:6px 0}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* ---------- search ---------- */
.search{position:relative;width:100%}
.search .input{padding-left:40px}
.search::before{content:"";position:absolute;left:14px;top:50%;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%);pointer-events:none}
.search::after{content:"";position:absolute;left:26px;top:50%;width:7px;height:2px;background:var(--muted);transform:translateY(5px) rotate(45deg);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,420px);overflow:auto;z-index:20;padding:4px}
.res{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.res:hover,.res.on{background:var(--accent-soft)}
.res .cv{width:30px}
.res b{font-weight:600;font-size:14.5px;display:block;line-height:1.25}
.res small{font-size:12px;color:var(--muted)}
.res .y{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.res .tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* ---------- covers ---------- */
.cv{--h:220;--ph:120;position:relative;display:block;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:5px;overflow:hidden;color:#fff;container-type:inline-size;isolation:isolate;flex:none;
  border:0;padding:0;text-align:left;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12),0 1px 2px rgb(0 0 0 / .18);
  background:linear-gradient(160deg,hsl(var(--h) 55% 40%),hsl(calc(var(--h) + 35) 60% 17%))}
.cv .ct{position:absolute;left:9%;right:9%;top:9%;z-index:2;font-family:var(--f-display);font-weight:700;line-height:1.08;font-size:clamp(5px,calc(11.5cqw * var(--k,1)),22px);
  overflow-wrap:anywhere;hyphens:auto;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 2px rgb(0 0 0 / .35)}
.cv .cy{position:absolute;right:8%;bottom:6%;z-index:2;font-family:var(--f-mono);font-size:clamp(5px,8cqw,13px);opacity:.85}
.cv .gl{position:absolute;left:8%;bottom:7%;z-index:2;width:21%;aspect-ratio:1;background:var(--gl) center/contain no-repeat;image-rendering:pixelated;opacity:.9}
@container (max-width:58px){.cv .ct,.cv .cy{display:none}.cv .gl{left:50%;top:50%;bottom:auto;width:44%;transform:translate(-50%,-50%)}}
.cv.e0{background:radial-gradient(120% 85% at 50% 38%,hsl(var(--ph) 65% 17%),#020503)}
.cv.e0 .ct{font-family:var(--f-pixel);font-weight:400;text-transform:uppercase;line-height:1.2;color:hsl(var(--ph) 95% 68%);text-shadow:0 0 6px hsl(var(--ph) 95% 50% / .6)}
.cv.e0 .gl{filter:drop-shadow(0 0 3px hsl(var(--ph) 95% 55%))}
.cv.e0::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgb(0 0 0 / .35) 0 1px,transparent 1px 3px)}
.cv.e1{background:hsl(var(--h) 22% 13%)}
.cv.e1::before{content:"";position:absolute;left:0;right:0;top:63%;height:17%;background:linear-gradient(180deg,hsl(var(--h) 85% 56%) 0 25%,hsl(calc(var(--h) + 28) 85% 56%) 25% 50%,hsl(calc(var(--h) + 56) 85% 56%) 50% 75%,hsl(calc(var(--h) + 84) 85% 56%) 75%)}
.cv.e2{background:hsl(var(--h) 58% 37%)}
.cv.e2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgb(0 0 0 / .17) 1px,transparent 1px),linear-gradient(90deg,rgb(0 0 0 / .17) 1px,transparent 1px);background-size:12.5% 9.375%}
.cv.e2::after{content:"";position:absolute;left:0;right:0;top:0;height:6%;background:#101014}
.cv.e2 .ct{top:13%;font-family:var(--f-pixel);font-weight:400;text-transform:uppercase;line-height:1.18}
@container (max-width:96px){.cv.e2 .ct{font-family:var(--f-display);font-weight:700;text-transform:none;line-height:1.08}}
.cv.e3::before{content:"";position:absolute;left:0;right:0;top:66%;height:2px;background:hsl(calc(var(--h) + 50) 95% 72%);box-shadow:0 0 14px 3px hsl(calc(var(--h) + 50) 95% 60% / .8)}
.cv.e4::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10%;background:#0B0C11;box-shadow:1px 0 0 rgb(255 255 255 / .22)}
.cv.e4 .ct{left:17%}
.cv.e4 .gl{left:17%}
.cv.e5::before{content:"";position:absolute;left:0;right:0;top:0;height:11%;background:linear-gradient(90deg,hsl(var(--h) 18% 93%),hsl(var(--h) 12% 80%))}
.cv.e5 .ct{top:18%}
.cv.e6{background:hsl(var(--h) 60% 45%);border-radius:7px}
.cv.e6 .gl{left:50%;top:40%;bottom:auto;width:42%;transform:translate(-50%,-50%);opacity:.95}
.cv.e6 .ct{top:auto;bottom:15%;font-size:clamp(5px,calc(10cqw * var(--k,1)),19px);-webkit-line-clamp:3}
.cv.e6 .cy{bottom:5%}
.cv .cimg{position:absolute;inset:0;z-index:4;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s ease-out;background:var(--card)}
.cv.hasimg .cimg{opacity:1}
.cv.hasimg .ct,.cv.hasimg .gl,.cv.hasimg .cy,.cv.hasimg::before,.cv.hasimg::after{opacity:0;transition:opacity .15s}
:root[data-art="era"] .cv .cimg{display:none}
:root[data-art="era"] .cv.hasimg .ct,:root[data-art="era"] .cv.hasimg .gl,:root[data-art="era"] .cv.hasimg .cy,:root[data-art="era"] .cv.hasimg::before,:root[data-art="era"] .cv.hasimg::after{opacity:1}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 12px}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.tile .artwrap{position:relative;width:100%}
.tile .art{position:relative;display:block;border:0;background:none;padding:0;width:100%;cursor:pointer;border-radius:6px}
.tile .tjump{position:absolute;right:4px;bottom:4px;z-index:6;width:23px;height:23px;border-radius:6px;border:1px solid rgb(255 255 255 / .28);background:rgb(15 20 28 / .76);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px);opacity:.86}
.tile .tjump:hover{opacity:1;background:var(--accent);color:var(--accent-ink)}
.tile .tn{font-size:12.5px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.tile .ts{font-size:11.5px;color:var(--muted);line-height:1.3}
.tile .tmem{font-size:11px;color:var(--accent);line-height:1.25;font-style:italic;overflow-wrap:anywhere}
.tile.lv1 .cv{box-shadow:0 0 0 2px var(--accent)}
.tile.lv2 .cv{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--hook)}
.tile.lv3 .cv{box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--love)}
.lvb{position:absolute;top:-7px;right:-7px;z-index:6;min-width:24px;height:24px;box-sizing:border-box;border-radius:12px;padding:0 6px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;box-shadow:0 0 0 2px var(--paper)}
.lv2 > .art .lvb,.lv2 > .artwrap .lvb,.lvb.l2{background:var(--hook);color:var(--hook-ink)}
.lv3 > .art .lvb,.lv3 > .artwrap .lvb,.lvb.l3{background:var(--love);color:var(--love-ink)}
.tile .art:active .cv{transform:scale(.97)}
.tap-hint{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:6px 0 2px}
.tap-hint b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;padding:0 5px;margin-right:4px}
.tap-hint b.l2{background:var(--hook);color:var(--hook-ink)}
.tap-hint b.l3{background:var(--love);color:var(--love-ink)}

/* ---------- start / hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:44px 22px}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:26px;padding-block:28px 10px}}
.start{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;max-width:460px}
.start .field{flex:1 1 170px}
.start .input{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;padding-block:10px}
.start .btn{padding:13px 18px;font-size:15px}
.shelf{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;box-shadow:var(--shadow)}
.shelf h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px}
.shelf h2 b{color:var(--ink)}
.shelfrow{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.sbook{flex:none;width:76px;display:flex;flex-direction:column;gap:5px;border:0;background:none;padding:0;color:inherit;text-align:left}
.sbook .yr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sbook b{font-size:11.5px;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.sarrow{flex:none;align-self:center;color:var(--line2);font-size:13px;margin-top:-34px}
.shelf .foot{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.trybar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.bigsearch .input{font-size:17px;padding-block:13px}

/* ---------- onboarding ---------- */
.steps{display:flex;gap:6px;align-items:center;font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.steps i{width:26px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sysgroups{display:flex;flex-direction:column;gap:14px;margin:16px 0}
.sysgroup h3{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.syschip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;text-align:left;margin:0 6px 6px 0}
.syschip b{font-size:14px;font-weight:600}
.syschip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.syschip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.syschip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.band{padding-block:20px 4px}
.band h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pickbar{position:sticky;bottom:0;z-index:15;margin-top:24px;background:var(--paper);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.pickbar .in{display:flex;align-items:center;gap:14px}
.pickbar .count{font-weight:700;font-size:15px;white-space:nowrap}
.pickbar .count small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.minihist{flex:1;min-width:60px;display:flex;align-items:flex-end;gap:1px;height:30px}
.minihist i{flex:1;background:var(--accent);border-radius:1px 1px 0 0;min-height:1px;opacity:.85}
.minihist i.z{background:var(--line);opacity:1}
.minihist i.l{background:var(--love)}

/* ---------- my timeline ---------- */

/* ---------- marquee spotlight, studios & clone lens ---------- */
.marquee{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-top:18px}
.marquee-in{display:grid;grid-template-columns:92px minmax(0,1fr);gap:18px;align-items:center}
.marquee-in > .cv{width:92px;box-shadow:0 8px 22px rgb(0 0 0 / .28)}
@media (max-width:560px){.marquee-in{grid-template-columns:72px minmax(0,1fr);gap:14px}.marquee-in > .cv{width:72px}}
.relbadge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.relbadge.warn{background:var(--hook-soft);color:var(--hook)}
.relbadge.disp{background:var(--love-soft);color:var(--love)}
.stbtn{border:0;background:none;padding:0;color:var(--ink2);font:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;cursor:pointer;text-align:left}
.stbtn:hover{color:var(--accent);text-decoration-color:var(--accent)}
.makerbtn{display:inline-flex;gap:7px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink);text-decoration:none}
.makerbtn:hover{border-color:var(--accent);color:var(--accent)}
.makerbtn span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.stcard{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;color:inherit}
.stcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.ststatus{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.ststatus.closed{background:var(--love-soft);color:var(--love)}
.ststatus.revived{background:var(--hook-soft);color:var(--hook)}
.ststatus.active{background:var(--down);color:var(--down-ink)}
.diasgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;margin-top:10px}
.diascard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.memquote{margin:8px 0 0;padding:8px 12px;background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--ink);font-style:italic}
.lensgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.lenscol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}

G.forEach(g=>{g.tree=UP[g.i].length+DOWN[g.i].length>0});

const findGame=t=>t?(byNorm.get(norm(t))||byNorm1.get(norm1(t))||null):null;

const findGameY=(t,y)=>{const g=findGame(t);if(!g||!y||Math.abs(g.year-y)<=1)return g;return byNorm.get(norm(t+" ("+y+")"))||g};
const tierOn=l=>!!state.tiers[l.tier]||(l.disputed&&!!state.tiers.disp);
const srcHTML=(src,tier)=>(src||[]).map(([tt,u])=>{const isWiki=u&&/wikipedia\.org/i.test(u);const lbl=tt||u;const tag=(tier==="dev"&&isWiki&&!/wikipedia/i.test(lbl))?`${lbl} (via Wikipedia)`:lbl;return u&&/^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(tag)}</a>`:esc(tag)}).filter(Boolean).join(" · ");

 ["N","Game Boy Color",1998,2003],["S","Sega CD",1991,1996],["O","TurboGrafx-16",1987,1994],["O","Neo Geo",1990,2004],["O","Atari Lynx",1989,1995],["O","3DO",1993,1996],["O","Atari Jaguar",1993,1996],

/* ---------- pixel glyphs for covers (8×8, one per genre family) ---------- */
const GLYPH_ART={

/* a generated box: the era sets the packaging style, the genre sets the pixel glyph; real box art fades in over it when available */
function coverHTML(title,year,h,glyph,{tag="div",attrs="",cls="",showYear=true,img=""}={}){

/* ---------- search ---------- */
function searchGames(q,{limit=8,treeOnly=false,catFirst=false,playOnly=false}={}){
  const v=norm(q),vr=normR(q);if(!v)return [];
  const words=fold(q).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const out=[];
  for(const g of G){
    if(treeOnly&&!g.tree)continue;
    if(playOnly&&!playable(g))continue;
    let s=-1;
    if(g.n===v||g.nr===vr)s=120;
    else if(g.n.startsWith(v)||g.nr.startsWith(vr))s=88;
    else if(g.aka&&g.aka.split(" ").some(a=>a===q.trim().toLowerCase()||norm(a)===v))s=110;
    else if(g.n.includes(v)||g.nr.includes(vr))s=60;
    else if(words.length>1){const tw=fold(g.title).toLowerCase().split(/[^a-z0-9]+/);if(words.every(w=>tw.some(t=>t.startsWith(w)||(ROMAN[t]&&String(ROMAN[t])===w))))s=55}
    if(s<0)continue;
    s+=g.pop*4+Math.min(g.inf,400)/50+(g.tree?6:0)+(catFirst&&g.cat?4:0);
    out.push([s,g]);
  }
  return out.sort((a,b)=>b[0]-a[0]).slice(0,limit).map(x=>x[1]);
}

/* ---------- graph: roots, family tree, connections ---------- */
/* the main line back in time: strongest evidence, staying within the genre family where possible,
   so a minor borrowing (a space-combat scene in an RPG) doesn't hijack an RPG's lineage */
const ROOT_W={dev:3,team:2.5,critic:2,mech:1.4,series:.9,disp:0};
/* fold runs of 3+ sequels into one step: keep the newest and oldest of the run */
function compressChain(chain){const out=[];let i=0;
  while(i<chain.length){let r=0;while(i+r<chain.length-1&&chain[i+r].link&&chain[i+r].link.tier==="series")r++;
    if(r>=3){out.push({g:chain[i].g,link:null,collapsed:{n:r-1,to:chain[i+r].g,via:chain.slice(i+1,i+r).map(s=>s.g)}});i+=r}
    else{out.push(chain[i]);i++}}
  return out}
const famOf=g=>new Set(g.gen.map(gi=>laneOfGenre[GEN[gi].k]));
/* step by step: at each game take the most relevant inspiration (strong evidence, same kind of game),
   with a bonus for branches whose ancestry reaches further back in time */
function rootsChain(i){
  const fam=new Map(),minY=new Map(),visiting=new Set();
  const F=v=>{if(!fam.has(v))fam.set(v,famOf(G[v]));return fam.get(v)};
  const ok=l=>tierOn(l)&&l.tier!=="disp"&&!l.minor;
  const reach=v=>{if(minY.has(v))return minY.get(v);if(visiting.has(v))return G[v].year;visiting.add(v);let m=G[v].year;
    for(const l of UP[v])if(ok(l))m=Math.min(m,reach(l.from));visiting.delete(v);minY.set(v,m);return m};
  const steps=[];let v=i;const seen=new Set();
  while(steps.length<70&&!seen.has(v)){
    seen.add(v);const fv=F(v),gv=G[v],sv=studio(gv).toLowerCase();let best=null,bs=-1e9;
    for(const l of UP[v]){if(!ok(l)||seen.has(l.from))continue;const p=G[l.from],fp=F(l.from);
      const aff=(p.gen.length===0||[...fp].some(x=>fv.has(x)))?1:fp.has(0)?.7:.25;
      const prim=p.gen.length&&gv.gen.length?(p.gen[0]===gv.gen[0]?.6:(gv.gen.includes(p.gen[0])||p.gen.includes(gv.gen[0]))?.25:0):0;
      const same=sv&&studio(p).toLowerCase()===sv?.5:0;
      const s=ROOT_W[l.tier]*aff+0.25*Math.min(6,(gv.year-reach(l.from))/10)+prim+same+0.05*p.pop;
      if(s>bs){bs=s;best=l}}
    steps.push({g:G[v],link:best});if(!best)break;v=best.from;
  }
  return steps; // newest first; each step's link points to the next (older) step
}
function ancestors(i){const seen=new Set([i]),st=[i];while(st.length){const v=st.pop();for(const l of UP[v])if(!seen.has(l.from)){seen.add(l.from);st.push(l.from)}}seen.delete(i);return seen}
/* parents and grandparents only: the influences you'd actually feel in a game */
function nearAncestors(i){const out=new Set();for(const l of UP[i]){out.add(l.from);for(const l2 of UP[l.from])out.add(l2.from)}out.delete(i);return out}
function connectPath(a,b){
  if(a===b)return [];const prev=new Map([[a,null]]),q=[a];let h=0;
  while(h<q.length){const v=q[h++];if(v===b)break;
    const ls=[...UP[v],...DOWN[v]].sort((x,y)=>TIERS[y.t].w-TIERS[x.t].w);
    for(const l of ls){const w=l.from===v?l.to:l.from;if(!prev.has(w)){prev.set(w,{v,l});q.push(w)}}}
  if(!prev.has(b))return null;const path=[];let x=b;while(x!==a){const p=prev.get(x);path.unshift({a:p.v,b:x,l:p.l});x=p.v}return path;
}

/* ================================================================
   My timeline: storage, levels, memories, share links, sync
   ================================================================ */
const LV={1:{m:"✓",label:"Played"},2:{m:"★",label:"Played a ton"},3:{m:"♥",label:"Favorite"}};
const MEM_TAGS=["Couch co-op","With siblings","With friends","LAN party","After school","Summer break","Late nights","Arcade","Hand-me-down"];
const lvOf=e=>{const v=(e&&e.lv)|0;return v>=1&&v<=3?v:1};
function blankHist(){return {birth:null,name:"",owned:[],years:{},top10:[],favOrder:[],sysDef:{},updated:0,stage:null}}
/* everything that arrives from someone else (a share link, another viewer's saved doc) goes through here */
function cleanTimeline(raw){
  const d=blankHist();if(!raw||typeof raw!=="object")return d;
  const by=parseInt(raw.birth,10);d.birth=by>=1900&&by<=NOW?by:null;
  d.name=typeof raw.name==="string"?raw.name.slice(0,24):"";
  const strs=(a,n,m)=>Array.isArray(a)?a.filter(s=>typeof s==="string").slice(0,n).map(s=>s.slice(0,m)):[];
  d.owned=strs(raw.owned,60,40);d.top10=strs(raw.top10,10,120);
  const ys=raw.years&&typeof raw.years==="object"?raw.years:{};
  for(const [k,arr] of Object.entries(ys)){const y=parseInt(k,10);if(!(y>=1800&&y<=NOW)||String(y)!==String(k).trim()||!Array.isArray(arr))continue;
    const out=[];for(const e of arr.slice(0,400)){if(!e||typeof e.t!=="string"||!e.t.trim())continue;
      const x={t:e.t.slice(0,120),p:typeof e.p==="string"?e.p.slice(0,2):"",y:Number.isInteger(e.y)?e.y:null,lv:lvOf(e)};
      if(Array.isArray(e.systems))x.systems=strs(e.systems,8,40);if(typeof e.sys==="string")x.sys=e.sys.slice(0,40);
      if(typeof e.mem==="string"&&e.mem.trim())x.mem=e.mem.trim().slice(0,90);
      if(Array.isArray(e.mtags)&&e.mtags.length)x.mtags=strs(e.mtags,4,24);
      out.push(x)}
    if(out.length)d.years[y]=out}
  d.updated=Number(raw.updated)||0;return d;
}
let hist=Object.assign(blankHist(),store.get("ib-history")||{});
if(!hist.years)hist.years={};
if(hist.birth&&hist.onboard===true&&!hist.stage)hist.stage=null; // version 1 flag: treat as finished
delete hist.onboard;
const pileOf=(d,y)=>(d.years[y]||(d.years[y]=[]));
function entries(d){const out=[];for(const [y,p] of Object.entries(d.years||{}))for(const e of p)out.push({e,y:+y,g:findGameY(e.t,e.y||+y),lv:lvOf(e)});return out}
function entryOf(d,g){for(const [y,p] of Object.entries(d.years||{})){const e=p.find(x=>{const k=norm(x.t);return k===g.n||norm1(x.t)===norm1(g.title)});if(e)return e}return null}
function entryYearOf(d,g){for(const [y,p] of Object.entries(d.years||{})){const e=p.find(x=>{const k=norm(x.t);return k===g.n||norm1(x.t)===norm1(g.title)});if(e)return +y}return null}
const levelOf=(d,g)=>{const e=entryOf(d,g);return e?lvOf(e):0};
const sortPile=p=>p.sort((a,b)=>lvOf(b)-lvOf(a));
/* default year when picking a game: if it came out before you turned 5, place it in early childhood (age 6) so you aren't playing NES at age 1 */
function defaultPlayedYear(g){
  if(hist.birth&&g.year<hist.birth+5)return Math.min(NOW,Math.max(g.year,hist.birth+6));
  return g.year;
}
function setLevel(g,lv,forceYear=null){
  for(const [y,p] of Object.entries(hist.years)){const i=p.findIndex(x=>norm(x.t)===g.n||norm1(x.t)===norm1(g.title));
    if(i>=0){if(lv<=0)p.splice(i,1);else p[i].lv=lv;sortPile(p);save();return}}
  if(lv>0){const py=forceYear||defaultPlayedYear(g);const p=pileOf(hist,py);p.push({t:g.title,p:brandOf(g),y:g.year,lv});sortPile(p);save()}
}
function moveEntryYear(fromY,title,toY){
  if(fromY===toY||!(toY>=1950&&toY<=NOW))return fromY;
  const p=hist.years[fromY];if(!p)return fromY;
  const i=p.findIndex(x=>norm(x.t)===norm(title));if(i<0)return fromY;
  const [e]=p.splice(i,1);
  const dst=pileOf(hist,toY);
  if(!dst.some(x=>norm(x.t)===norm(title)))dst.push(e);
  sortPile(dst);save();return toY;
}
function cycleLevel(g){const cur=levelOf(hist,g),nl=cur>=3?0:cur+1;setLevel(g,nl);return nl}
function addCustom(title,y,lv=1){const p=pileOf(hist,y);if(!p.some(x=>norm(x.t)===norm(title)))p.push({t:title,p:"",y:null,lv});sortPile(p);save()}
function removeEntry(y,t){const p=hist.years[y];if(!p)return;const i=p.findIndex(x=>norm(x.t)===norm(t));if(i>=0)p.splice(i,1);save()}
/* systems a game was played on: chosen, else the first of its platforms you said you owned */
function sysListOf(e,d){if(Array.isArray(e.systems))return [...new Set(e.systems.map(canonSys))];if(e.sys)return [canonSys(e.sys)];
  const g=findGame(e.t);if(!g)return [];const ps=sysOfGame(g);const own=(d&&d.owned)||[];const hit=ps.find(p=>own.includes(p));return hit?[hit]:ps.slice(0,1)}

/* share links carry the whole timeline in the hash: t1-name-birth-systems-played-alot-favorites-top10-custom(-notes) */
const b36=(n,w)=>n.toString(36).padStart(w,"0");
const toHex=(s,max)=>[...new TextEncoder().encode(String(s)).slice(0,max)].map(b=>b.toString(16).padStart(2,"0")).join("");
const fromHex=h=>{try{return new TextDecoder().decode(new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))))}catch(e){return ""}};
function encodeShare(d){
  const lv={1:[],2:[],3:[]},custom=[],notes=[];
  for(const {e,y,g,lv:l} of entries(d)){
    if(g&&g.year===y&&g.code<46656)lv[l].push(b36(g.code,3));
    else if(g&&g.code<46656)custom.push("g"+String(y-1900).padStart(3,"0")+l+b36(g.code,3));
    else custom.push(String(y-1900).padStart(3,"0")+l+toHex(e.t,40));
    if(g&&g.code<46656&&(e.mem||(e.mtags&&e.mtags.length))){
      const ti=(e.mtags||[]).map(t=>MEM_TAGS.indexOf(t)).filter(k=>k>=0).join("");
      notes.push(b36(g.code,3)+ti+"q"+toHex(e.mem||"",50));
    }
  }
  const owned=(d.owned||[]).map(n=>SYS_IDX.get(n)).filter(i=>i!=null).map(i=>b36(i,2)).join("");
  const t10=(d.top10||[]).map(k=>{const g=byNorm.get(k)||byNorm1.get(k);return g?b36(g.code,3):""}).join("");
  const parts=["t1",toHex(d.name||"",24),d.birth||0,owned,lv[1].join(""),lv[2].join(""),lv[3].join(""),t10,custom.join("z")];
  if(notes.length)parts.push(notes.join("z"));
  return parts.join("-");
}
function decodeShare(s){
  const p=s.split("-");if(p[0]!=="t1"||p.length<8)return null;
  const d=Object.assign(blankHist(),{name:fromHex(p[1]),birth:+p[2]||null});
  for(let i=0;i+2<=p[3].length;i+=2){const sy=SYSTEMS[parseInt(p[3].substr(i,2),36)];if(sy)d.owned.push(sy[1])}
  [4,5,6].forEach((k,j)=>{const seg=p[k]||"";for(let i=0;i+3<=seg.length;i+=3){const g=byCode.get(parseInt(seg.substr(i,3),36));if(g)pileOf(d,g.year).push({t:g.title,p:brandOf(g),y:g.year,lv:j+1})}});
  const t=p[7]||"";for(let i=0;i+3<=t.length;i+=3){const g=byCode.get(parseInt(t.substr(i,3),36));if(g)d.top10.push(g.n)}
  (p[8]||"").split("z").filter(Boolean).forEach(x=>{
    if(x[0]==="g"&&x.length>=8){const y=1900+parseInt(x.slice(1,4),10),l=+x[4]||1,g=byCode.get(parseInt(x.slice(5,8),36));if(g&&y>1900)pileOf(d,y).push({t:g.title,p:brandOf(g),y:g.year,lv:l})}
    else{const y=1900+parseInt(x.slice(0,3),10),l=+x[3]||1,title=fromHex(x.slice(4));if(title&&y>1900)pileOf(d,y).push({t:title,p:"",y:null,lv:l})}
  });
  if(p[9]){(p[9]||"").split("z").filter(Boolean).forEach(x=>{
    const g=byCode.get(parseInt(x.slice(0,3),36));if(!g)return;
    const qi=x.indexOf("q",3);if(qi<0)return;
    const tags=[...x.slice(3,qi)].map(c=>MEM_TAGS[+c]).filter(Boolean),mem=fromHex(x.slice(qi+1));
    const e=entryOf(d,g);if(e){if(tags.length)e.mtags=tags;if(mem)e.mem=mem}
  })}
  const c=cleanTimeline(d);c.years&&Object.values(c.years).forEach(sortPile);return c.birth?c:null;
}
const shareLink=d=>shareBase()+"#"+encodeShare(d);

/* ---------- capabilities: database sync and the friends wall ---------- */
const CAPS={db:null,user:null,me:null,owner:false,canWrite:null,ok:false,comments:null};
let FRIENDS={db:[],wall:[]};
let seen=store.get("ib2-seen",[]); // timelines opened from links on this device
const DEC=new Map(); // decoded share links, by payload
let syncT=null,syncing=false,syncAgain=false;
function queueSync(){if(!CAPS.db||!CAPS.me||CAPS.canWrite===false)return;clearTimeout(syncT);syncT=setTimeout(flush,1200)}
function packHist(h){const years={};for(const [y,p] of Object.entries(h.years||{}))if(p.length)years[y]=p;
  return {v:2,birth:h.birth,name:h.name||"",owned:h.owned||[],years,sysDef:h.sysDef||{},favOrder:h.favOrder||[],top10:h.top10||[],updated:h.updated||Date.now()}}

  catch(e){if(e&&e.code==="invalid_argument")CAPS.canWrite=false;syncMsg="Saved on this device"}

async function initCaps(){

    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);

/* the two halves meet: the ancestors behind the games you played */
function dnaOf(d){
  const mine=entries(d).filter(x=>x.g);const set=new Set(mine.map(x=>x.g.i));const anc=new Map(),all=new Set();
  for(const x of mine){ancestors(x.g.i).forEach(a=>all.add(a));for(const a of nearAncestors(x.g.i)){const o=anc.get(a)||{n:0,w:0,kids:[]};o.n++;o.w+=x.lv;if(o.kids.length<3)o.kids.push(x.g);anc.set(a,o)}}
  const top=[...anc.entries()].map(([i,o])=>({g:G[i],...o,played:set.has(i)})).sort((a,b)=>b.n-a.n||b.w-a.w||a.g.year-b.g.year);
  let oldest=null;all.forEach(i=>{if(!oldest||G[i].year<oldest.g.year)oldest={g:G[i]}});
  const allCount=all.size;
  const gw={};mine.forEach(x=>x.g.gen.forEach((gi,k)=>{gw[gi]=(gw[gi]||0)+x.lv*(k?0.5:1)}));
  const genres=Object.entries(gw).map(([i,w])=>({gen:GEN[i],w})).sort((a,b)=>b.w-a.w);
  const nextUp=[];const seenNext=new Set();
  mine.filter(x=>x.lv>=2).sort((a,b)=>b.lv-a.lv||b.g.pop-a.g.pop).forEach(x=>DOWN[x.g.i].forEach(l=>{const c=G[l.to];if(set.has(c.i)||seenNext.has(c.i)||c.year>NOW)return;seenNext.add(c.i);nextUp.push({g:c,because:x.g,s:c.pop*10+Math.min(c.inf,200)/20+(x.lv===3?8:0)+(l.tier==="dev"?4:0)})}));
  nextUp.sort((a,b)=>b.s-a.s);
  const missed=top.filter(a=>!a.played&&a.g.pop>=3&&a.n>=2).slice(0,8);

      <div class="roots" id="rootsRow">${ch.map((s,k)=>{const nx=ch[k+1];

      :`<section class="sec"><p class="sub">No recorded roots yet.</p></section>`}
    ${g.tree?`<section class="sec"><div class="sechead"><div><h2 class="h2">Family tree</h2><p class="sub">Two generations back and forward. Tap a game to move the tree to it.</p></div></div>
      <div class="row" style="margin-bottom:10px">${TIERS.map(t=>`<button class="chip tierchip" style="--c:var(${t.c})" data-act="tier" data-tier="${t.k}" aria-pressed="${!!state.tiers[t.k]}"><span class="dot"></span>${t.label}</button>`).join("")}</div>

  requestAnimationFrame(()=>{const rr=$("#rootsRow");if(rr)rr.scrollLeft=rr.scrollWidth;
    const tb=$("#treebox");if(tb){const c=tb.querySelector("[data-center]");if(c){const x=+c.dataset.cx;tb.scrollLeft=Math.max(0,x-tb.clientWidth/2)}}});

/* catalog-only games: no dead end, point to nearby games that are in the family tree */
function relatedSection(g){
  const fam=new Set(g.gen);const rel=TREE.filter(t=>t.gen.some(x=>fam.has(x))&&Math.abs(t.year-g.year)<=4).sort((a,b)=>(b.pop*10+Math.min(b.inf,300)/10)-(a.pop*10+Math.min(a.inf,300)/10)).slice(0,8);
  return `<section class="sec"><div class="card"><h2 class="h3">${esc(g.title)} isn't in the family tree yet</h2><p class="sub" style="margin:0">It's in the catalog, so you can add it to your timeline. Nobody has recorded what inspired it yet.</p></div>
    ${rel.length?`<h2 class="h2" style="margin-top:22px">Related games in the family tree</h2><p class="sub">Same kind of game, from around the same time.</p><div class="recs">${rel.map(r=>`<div class="tile"><button class="art" data-act="game" data-id="${r.id}">${cover(r)}</button><span class="tn">${esc(r.title)}</span><span class="ts">${r.year} · ${esc(studio(r))}</span></div>`).join("")}</div>`:""}</section>`;
}
/* two generations each way, capped per column; ordered by year */
function treeSVG(g){
  const gen=new Map([[g.i,0]]),cols={"-2":[],"-1":[],"0":[g.i],"1":[],"2":[]};
  const imp=i=>G[i].pop*10+Math.min(G[i].inf,500)/10;
  const add=(i,k)=>{if(!gen.has(i)){gen.set(i,k);cols[k].push(i)}};
  UP[g.i].filter(tierOn).forEach(l=>add(l.from,-1));
  DOWN[g.i].filter(tierOn).forEach(l=>add(l.to,1));
  const cap=k=>state.treeMore["c"+k]?60:9;
  const trim=k=>{cols[k].sort((a,b)=>imp(b)-imp(a));const more=cols[k].length-cap(k);if(more>0){cols[k].slice(cap(k)).forEach(i=>gen.delete(i));cols[k]=cols[k].slice(0,cap(k))}return Math.max(0,more)};
  const more={"-1":trim(-1),"1":trim(1)};
  cols["-1"].forEach(i=>UP[i].filter(tierOn).forEach(l=>add(l.from,-2)));
  cols["1"].forEach(i=>DOWN[i].filter(tierOn).forEach(l=>add(l.to,2)));
  more["-2"]=trim(-2);more["2"]=trim(2);
  const ks=[-2,-1,0,1,2].filter(k=>cols[k].length);
  ks.forEach(k=>cols[k].sort((a,b)=>G[a].year-G[b].year||G[a].title.localeCompare(G[b].title)));
  const W=176,H=46,RG=10,CG=56,M=16,TOP=40;
  const maxRows=Math.max(...ks.map(k=>cols[k].length+(more[k]?1:0)));
  const pos=new Map();const colX={};ks.forEach((k,ci)=>colX[k]=M+ci*(W+CG));
  ks.forEach(k=>{const n=cols[k].length+(more[k]?1:0),off=(maxRows-n)/2*(H+RG);cols[k].forEach((i,r)=>pos.set(i,{x:colX[k],y:TOP+off+r*(H+RG)}))});
  const width=M*2+ks.length*(W+CG)-CG,height=TOP+maxRows*(H+RG)+10;
  const C=cssVar,ink=C("--ink"),muted=C("--muted"),line2=C("--line2"),card=C("--card"),paper=C("--paper"),acc=C("--accent"),accInk=C("--accent-ink"),upInk=C("--up-ink"),downInk=C("--down-ink");
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, system-ui, sans-serif" style="display:block" role="img" aria-label="Family tree of ${esc(g.title)}">`;
  const lab={"-2":"Inspired its inspirations","-1":"Inspired it","0":"This game","1":"It inspired","2":"Which inspired"};
  ks.forEach(k=>{s+=`<text x="${colX[k]+W/2}" y="22" text-anchor="middle" font-size="11.5" font-weight="700" fill="${k<0?upInk:k>0?downInk:ink}">${lab[k]}</text>`});
  const edges=L.filter(l=>tierOn(l)&&pos.has(l.from)&&pos.has(l.to)&&gen.get(l.to)-gen.get(l.from)===1);
  edges.forEach(l=>{const A=pos.get(l.from),B=pos.get(l.to),t=TIERS[l.t];const x1=A.x+W,y1=A.y+H/2,x2=B.x,y2=B.y+H/2,dx=Math.max(22,(x2-x1)/2);
    const touch=l.from===g.i||l.to===g.i;
    s+=`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${C(t.c)}" stroke-width="${touch?2.4:1.4}" ${t.dash?'stroke-dasharray="5 4"':""} opacity="${touch?.9:.45}"/>`});
  for(const [i,p] of pos){const n=G[i],isC=i===g.i;const t1=n.title.length>22?n.title.slice(0,21)+"…":n.title;const st=studio(n),t2=`${n.year} · ${st.length>16?st.slice(0,15)+"…":st}`;
    const myl=levelOf(hist,n);
    s+=`<g class="wnode" data-act="game" data-id="${n.id}" ${isC?`data-center="1" data-cx="${p.x+W/2}"`:""} tabindex="0" role="link" aria-label="${esc(n.title)}, ${n.year}">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="10" fill="${isC?acc:card}" stroke="${isC?acc:line2}" stroke-width="1"/>
      <rect x="${p.x+8}" y="${p.y+9}" width="21" height="28" rx="3" fill="hsl(${n.h} 55% 40%)"/>
      <text x="${p.x+37}" y="${p.y+19}" font-size="12.5" font-weight="700" fill="${isC?accInk:ink}">${esc(t1)}</text>
      <text x="${p.x+37}" y="${p.y+34}" font-size="10.5" fill="${isC?accInk:muted}">${esc(t2)}</text>
      ${myl?`<circle cx="${p.x+W-10}" cy="${p.y+10}" r="7" fill="${myl===3?C("--love"):acc}"/><text x="${p.x+W-10}" y="${p.y+13.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${paper}">${myl===3?"♥":"✓"}</text>`:""}</g>`}
  ks.forEach(k=>{if(more[k]){const n=cols[k].length,off=(maxRows-n-1)/2*(H+RG),y=TOP+off+n*(H+RG);
    s+=`<g class="wnode" data-act="treeMore" data-col="${k}" tabindex="0" role="button"><rect x="${colX[k]}" y="${y}" width="${W}" height="${H}" rx="10" fill="none" stroke="${line2}" stroke-dasharray="4 3"/><text x="${colX[k]+W/2}" y="${y+28}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${muted}">+${more[k]} more</text></g>`}});
  return s+`</svg>`;
}

/* ---------- story mode: walk the roots ---------- */
let story=null;
function openStory(chain){story={chain:compressChain(chain),total:chain.length-1,k:0};drawStory();document.addEventListener("keydown",storyKeys)}
function closeStory(){story=null;$("#layer").innerHTML="";document.removeEventListener("keydown",storyKeys)}
function storyKeys(e){if(!story)return;if(e.key==="ArrowRight"){storyStep(1)}else if(e.key==="ArrowLeft"){storyStep(-1)}else if(e.key==="Escape")closeStory()}
function storyStep(d){if(!story)return;const n=story.chain.length;story.k=Math.max(0,Math.min(n,story.k+d));drawStory()}
function drawStory(){
  const {chain,k}=story,n=chain.length;
  const prog=`<div class="stprog">${chain.map((_,j)=>`<i class="${j<=k?"on":""}"></i>`).join("")}<i class="${k>=n?"on":""}"></i></div>`;
  let body;
  if(k>=n){const a=chain[0].g,z=chain[n-1].g;const studios=new Set(chain.map(s=>studio(s.g)).filter(Boolean)),cs=new Set(chain.map(s=>s.g.cc).filter(Boolean));
    body=`<div class="wrap"><p class="eyebrow">The end of the line, for now</p><h2 class="h1" style="font-size:clamp(26px,5vw,42px)">${esc(z.title)} (${z.year})</h2>
      <p class="stsum">From ${esc(a.title)} back to ${esc(z.title)}: <b>${a.year-z.year} years</b>, ${plural(story.total,"step")}, ${plural(studios.size,"team")} in ${plural(cs.size,"country","countries")}. Every one of them added something of their own.</p>
      <div class="row" style="margin-top:18px"><button class="btn primary wrap" data-act="game" data-id="${z.id}" data-close="1">Open ${esc(z.title)}</button><button class="btn" data-act="storyRestart">Start over</button><button class="btn" data-act="copyWalk" data-id="${a.id}">Copy link to this walk</button></div></div>`}
  else{const s=chain[k],g=s.g,l=s.link,p=l?G[l.from]:null,t=l?TIERS[l.t]:null;
    const srcs=l?srcHTML(l.src,l.tier):"";
    body=`<div class="wrap"><div class="stin" key="${k}">${cover(g)}<div style="min-width:0"><div class="styear">${g.year}</div><h2>${esc(g.title)}</h2>
      <p class="sub" style="margin:0">${flag(g.cc)} ${esc(g.dev||"")}${hist.birth?` · ${g.year-hist.birth>=0?"first released when you were "+(g.year-hist.birth):(hist.birth-g.year)+" years before you were born"}`:""}</p>
      ${g.note?`<p class="gnote" style="font-size:14px">${esc(g.note)}</p>`:""}
      ${l?`<div class="stlink" style="--c:var(${t.c})"><p class="lead">It built on <b>${esc(p.title)}</b> (${p.year}) · <span class="tier">${t.label}</span></p><dl class="ta"><dt>${l.rel==="variant"||l.rel==="fast-follow"?"Changed":"Added"}</dt><dd class="add">${esc(l.added)}</dd><dt>Took</dt><dd>${esc(l.took)}</dd></dl>${srcs?`<div class="src">Source: ${srcs}</div>`:""}</div>`
        :s.collapsed?`<div class="stlink" style="--c:var(--t-series)"><p class="lead">It built on its own series: ${plural(s.collapsed.n,"earlier game")} back to <b>${esc(s.collapsed.to.title)}</b> (${s.collapsed.to.year}) · <span class="tier">Same series</span></p><p class="src" style="margin:4px 0 0">${esc(s.collapsed.via.map(v=>v.title+" ("+v.year+")").join(" · "))}</p></div>`
        :`<div class="stlink" style="--c:var(--line2)"><p class="lead">This is the oldest game in this chain.</p></div>`}
    </div></div></div>`}
  $("#layer").innerHTML=`<div class="story" role="dialog" aria-label="Walk the roots"><div class="wrap sthead">${prog}<span class="mono muted" style="font-size:12px">${Math.min(k+1,n)} / ${n}</span><button class="x" data-act="closeStory" aria-label="Close">×</button></div>
    <div class="stbody">${body}</div>
    <div class="wrap stfoot"><button class="btn" data-act="storyPrev" ${k===0?"disabled":""}>◂ Newer</button><button class="btn primary" data-act="storyNext" ${k>=n?"disabled":""}>${k>=n-1?"Finish":"Older ▸"}</button></div></div>`;
}

/* ---------- friends ---------- */
function overlap(a,b){const A=new Set(entries(a).map(x=>norm(x.e.t))),B=new Set(entries(b).map(x=>norm(x.e.t)));let both=0;A.forEach(k=>{if(B.has(k))both++});const uni=A.size+B.size-both;return {both,pct:uni?Math.round(both/uni*100):0}}

/* the crew together: what most of you played, and what you loved most */
function crewSection(fl){

  if(people.length<2)return "";

}
function friendsWhoPlayed(g){const out=[];friendList().forEach(f=>{const e=entryOf(f.data,g);if(e)out.push({name:f.name,lv:lvOf(e)})});return out}

function openCompare(f){

  const bothFav=both.filter(x=>x.a.lv===3&&x.b.lv===3);
  const onlyA=ea.filter(x=>!kb.has(norm(x.e.t))&&x.g).sort((x,y)=>y.lv-x.lv||y.g.pop-x.g.pop);

  }else{

  }
  const nm=f.name;

      const bx=cx-w/2,g=e.g;canvasCover(x,g?g.title:e.e.t,y,g?g.h:hueOf(norm(e.e.t)),g?glyphOf(g):"stick",bx,top,w,h);
      if(e.lv===3){x.strokeStyle="#FF6E5A";x.lineWidth=7;x.beginPath();x.roundRect(bx,top,w,h,Math.max(4,w*.05));x.stroke()}else if(e.lv===2){x.strokeStyle="#8C9DFF";x.lineWidth=4;x.beginPath();x.roundRect(bx,top,w,h,Math.max(4,w*.05));x.stroke()}
      boxes[norm(e.e.t)]={x:bx,y:top,w,h}})});
  wallLinks(d).forEach(({a,b})=>{const A=boxes[a],B=boxes[b];if(!A||!B)return;const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2,dx=Math.max(40,Math.abs(x2-x1)/2);
    x.strokeStyle="rgba(140,157,255,.8)";x.lineWidth=4;x.beginPath();x.moveTo(x1,y1);x.bezierCurveTo(x1+dx,y1,x2-dx,y2,x2,y2);x.stroke()});
  x.font="italic 400 28px IBM Plex Sans, sans-serif";x.fillStyle="#B9C1D2";x.fillText("Inspired By · the family tree of games",M,H-40);
  return cv;
}
function drawCard(d,name){
  const W=1080,H=1920,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#0E1428");bg.addColorStop(1,"#23163C");x.fillStyle=bg;x.fillRect(0,0,W,H);
  const st=timelineStats(d),es=entries(d);
  x.fillStyle="#8C9DFF";x.font="400 30px Silkscreen, IBM Plex Mono, monospace";x.fillText("MY LIFE IN GAMES",72,120);
  x.fillStyle="#F2F4F8";x.font="700 70px Unbounded, Arial Black, sans-serif";x.fillText(name||(d.name||"My timeline"),72,205);
  x.fillStyle="#AEB6C8";x.font="400 32px IBM Plex Mono, monospace";x.fillText(`born ${d.birth} · ${st.n} games · ${st.sys} systems`,72,262);
  const stages=[["Childhood",0,12],["Teens",13,19],["Twenties",20,29],["Thirties",30,39],["Forties",40,49]];let yy=350;
  for(const [label,a,b] of stages){const xs=es.filter(e=>e.y-d.birth>=a&&e.y-d.birth<=b).sort((p,q)=>q.lv-p.lv||((q.g&&q.g.pop)||0)-((p.g&&p.g.pop)||0)).slice(0,5);if(!xs.length)continue;if(yy>1520)break;
    x.fillStyle="#8C9DFF";x.font="400 26px Silkscreen, IBM Plex Mono, monospace";x.fillText(label.toUpperCase(),72,yy);yy+=24;
    xs.forEach((e,k)=>{const w=170,h=226,bx=72+k*(w+18);const g=e.g;canvasCover(x,g?g.title:e.e.t,e.y,g?g.h:hueOf(norm(e.e.t)),g?glyphOf(g):"stick",bx,yy,w,h);if(e.lv===3){x.strokeStyle="#FF6E5A";x.lineWidth=6;x.beginPath();x.roundRect(bx,yy,w,h,8);x.stroke()}});
    yy+=226+64}
  const dna=dnaOf(d);if(dna.top.length&&yy<1700){const a=dna.top[0];x.fillStyle="#8C9DFF";x.font="400 26px Silkscreen, IBM Plex Mono, monospace";x.fillText("MY GAMING DNA",72,yy);yy+=52;
    x.fillStyle="#F2F4F8";x.font="600 36px IBM Plex Sans, sans-serif";wrapText(x,`${a.n} of my games descend from ${a.g.title} (${a.g.year}).`,72,yy,936,46,2)}
  x.fillStyle="#7B84A0";x.font="italic 400 28px IBM Plex Sans, sans-serif";x.fillText("What did you play? · Inspired By",72,H-70);
  return cv;
}
async function saveImage(kind,who){
  const d=who==="friend"&&state.viewing?state.viewing.data:hist,name=who==="friend"&&state.viewing?state.viewing.name+"'s":null;
  const cv=kind==="card"?drawCard(d,name&&name.replace(/'s$/,"")):drawWallpaper(d,name);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const fname=kind==="card"?"my-life-in-games.png":"my-gaming-years-4k.png";
  try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:fname,data:blob});toast("Saved");return}}catch(e){if(e&&e.code==="declined")return}
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  toast("Image downloaded");
  const out=$("#imgout")||$("#posterBody");
  if(out)out.insertAdjacentHTML("afterbegin",`<p class="sub" style="margin-top:12px">Downloaded <b>${esc(fname)}</b> (on phones, you can also press and hold the preview below).</p><img class="imgprev" src="${url}" alt="Your timeline image">`);
}

  map(){openMap()},

  sugCopy(){const t=($("#sugSubj")||{}).value||"",s=($("#sugSrc")||{}).value||"",b=($("#sugBody")||{}).value||"";copyText(`Topic: ${t}\nSource: ${s}\nDetails: ${b}`);closeLayer()},
  game(el){const id=el.dataset.id;if(!id)return;if(el.dataset.close||story){closeStory();clearLayer()}go(id)},
  walk(el){const g=byId.get(el.dataset.id);if(!g)return;if(el.dataset.close)clearLayer();openStory(rootsChain(g.i))},
  random(){const pool=TREE.filter(g=>g.pop>=3&&UP[g.i].length);go(pool[Math.floor(Math.random()*pool.length)].id)},
  cycle(el){const g=byId.get(el.dataset.id);if(!g)return;cycleLevel(g);refreshTile(el,g);updatePickBar()},
  own(el){const n=el.dataset.sys,o=new Set(hist.owned||[]);o.has(n)?o.delete(n):o.add(n);hist.owned=[...o];save();el.setAttribute("aria-pressed",o.has(n));const c=$("#ownCount");if(c)c.textContent=o.size?plural(o.size,"system")+" picked":"Pick a few, or skip"},
  obBack(){if(entries(hist).length){hist.stage=null;save();go("timeline");return}hist.birth=null;hist.stage=null;save();go("start")},
  obPicks(){hist.stage="picks";save();render();window.scrollTo({top:0})},
  pickMore(el){const k=el.dataset.band;state.pickExtra[k]=(state.pickExtra[k]||0)+12;const y=window.scrollY;render();window.scrollTo({top:y})},
  obDone(){hist.stage=null;save();go("timeline")},
  obSystems(){hist.stage="systems";save();clearLayer();go("start")},
  obAgain(){hist.stage="picks";save();clearLayer();go("start")},
  setlv(el){const g=byId.get(el.dataset.id);const v=+el.dataset.lv;const cur=levelOf(hist,g);if(!hist.birth&&v>0){toast("Start your timeline first, then add games");go("start");return}setLevel(g,v===cur?0:v);render();toast(v&&v!==cur?`${LV[v].label}: ${g.title}`:`Removed ${g.title}`)},
  entry(el){openGameSheet(+el.dataset.y,el.dataset.t,!!el.dataset.ro)},
  entryLv(el){const y=+el.dataset.y,p=hist.years[y]||[],e=p.find(x=>norm(x.t)===norm(el.dataset.t));if(e){e.lv=+el.dataset.lv;sortPile(p);save();openGameSheet(y,e.t)}},
  entryYr(el){const ny=moveEntryYear(+el.dataset.y,el.dataset.t,+el.dataset.to);openGameSheet(ny,el.dataset.t);toast(`Moved to ${ny}`)},
  entryYrGo(el){const v=parseInt(($("#entryYrIn")||{}).value,10);if(!(v>=1950&&v<=NOW)){toast(`Enter a year between 1950 and ${NOW}`);return}const ny=moveEntryYear(+el.dataset.y,el.dataset.t,v);openGameSheet(ny,el.dataset.t);toast(`Moved to ${ny}`)},
  entryTag(el){const y=+el.dataset.y,e=(hist.years[y]||[]).find(x=>norm(x.t)===norm(el.dataset.t));if(!e)return;const tg=el.dataset.tag,cur=(e.mtags||[]).slice(),i=cur.indexOf(tg);if(i>=0)cur.splice(i,1);else if(cur.length<4)cur.push(tg);if(cur.length)e.mtags=cur;else delete e.mtags;save();openGameSheet(y,e.t)},
  entrySys(el){const y=+el.dataset.y,e=(hist.years[y]||[]).find(x=>norm(x.t)===norm(el.dataset.t));if(!e)return;const cur=sysListOf(e,hist).slice(),n=el.dataset.sys,i=cur.indexOf(n);if(i>=0)cur.splice(i,1);else cur.push(n);e.systems=cur;delete e.sys;save();openGameSheet(y,e.t)},
  entryRm(el){removeEntry(+el.dataset.y,el.dataset.t);closeLayer();toast("Removed")},
  year(el){openYearSheet(+el.dataset.y)},
  yearNav(el){openYearSheet(+el.dataset.y,($("#customIn")||{}).value||"")},

  share(){if(!hist.birth||!entries(hist).length){toast("Add some games first");return}openShare()},
  copyShare(){const v=$("#shareLink").value;copyText(v,$("#shareLink"))},
  webShare(){const u=shareLink(hist);if(navigator.share)navigator.share({title:`${hist.name?hist.name+"'s":"My"} life in games`,text:"Here's my gaming timeline — compare yours in two minutes:",url:u}).catch(()=>{})},
  emailSelf(){const u=shareLink(hist),sub=`My life in games (${entries(hist).length} games)`;location.href=`mailto:?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent("Here is my Inspired By gaming timeline link (open it on any device to view or continue editing):\n\n"+u)}`},
  dlJson(){const blob=new Blob([JSON.stringify(packHist(hist),null,2)],{type:"application/json"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`inspired-by-timeline-${hist.name?slugStudio(hist.name):hist.birth||"backup"}.json`;document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded")},
  adoptAsk(){const f=state.viewing;if(!f||!f.data)return;if(!entries(hist).length){hist=JSON.parse(JSON.stringify(f.data));save();toast("Loaded as your timeline");go("timeline");return}$("#adoptBox").innerHTML=`<div class="banner"><p>Replace your current timeline on this device (${plural(entries(hist).length,"game")}) with <b>${esc(f.name)}'s</b> (${plural(entries(f.data).length,"game")})?</p><div class="row"><button class="btn primary" data-act="adoptDo">Yes, load it</button><button class="btn" data-act="adoptNo">Cancel</button></div></div>`},
  adoptDo(){const f=state.viewing;if(!f||!f.data)return;hist=JSON.parse(JSON.stringify(f.data));save();toast("Loaded as your timeline");go("timeline")},
