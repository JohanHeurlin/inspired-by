name: Thank-You Note to Game Makers
description: Share a short personal thank-you note or memory for the studio or creators behind a game that mattered to you.
title: "[Gratitude] "
labels: ["gratitude"]
body:
  - type: markdown
    attributes:
      value: |
        **No rankings, no popularity contests — just human gratitude.** Many studios have closed or scattered over the decades, and credits roll past fast. Share what a game or team meant to your upbringing so makers know their craft still lives on.
  - type: input
    id: target
    attributes:
      label: Studio, creator, or game
      placeholder: e.g. Sensible Software / Cannon Fodder, or Looking Glass Studios
    validations:
      required: true
  - type: dropdown
    id: tag
    attributes:
      label: What kind of memory?
      options:
        - Carried me through tough times
        - Childhood safe harbor
        - Shaped who I am
        - Bonded me with siblings or friends
        - Pure unforgettable craft
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Optional context (era / system, no full name needed)
      placeholder: e.g. Born 1984 · Amiga 500 in Sweden
  - type: textarea
    id: note
    attributes:
      label: Your thank-you note to the makers
      placeholder: Write 1–3 sentences to the team who built it...
    validations:
      required: true
